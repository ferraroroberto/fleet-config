<!doctype html>
<!-- Static fixture for NAV-04 (fleet-config#1360), a pass: the home tab's header title is the tab's own name. The manifest is a data: URI (a file:
     page has no server to serve one); its name is "Spot Keeper" and its short_name "Spots". The second
     tab's header repeats the app's name on purpose: only the first tab is judged. Asserted by tests/test_design_review.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Spot%20Keeper%22%2C%22short_name%22%3A%22Spots%22%7D">
<title>design_review home-title pass fixture</title>
<style>
  html, body { margin: 0; background: #ffffff; color: #1f2328; font-family: system-ui, sans-serif; font-size: 16px; }
  body { padding: 16px; }
  section[hidden] { display: none; }
  button { font: inherit; min-width: 44px; min-height: 44px; }
  .home-head { display: flex; align-items: center; min-height: 52px; }
  .home-title { font-weight: 700; flex: 1; }
</style>
<script>
  addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('[role=tab]').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('[role=tab]').forEach(t => t.setAttribute('aria-selected', String(t === tab)));
      document.querySelectorAll('[role=tabpanel]').forEach(p => p.hidden = (p.id !== tab.getAttribute('aria-controls')));
    }));
  });
</script>
</head>
<body>
  <nav role="tablist" aria-label="Primary">
    <button type="button" role="tab" aria-controls="paneHome" aria-selected="true">Today</button>
    <button type="button" role="tab" aria-controls="paneHistory" aria-selected="false">History</button>
  </nav>
  <main>
    <section id="paneHome" role="tabpanel">
      <div class="home-head"><span class="home-title">Today</span></div>
      <p>Home pane.</p>
    </section>
    <section id="paneHistory" role="tabpanel" hidden>
      <div class="home-head"><span class="home-title">Spot Keeper</span></div>
      <p>History pane.</p>
    </section>
  </main>
</body>
</html>
