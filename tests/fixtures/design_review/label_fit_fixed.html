<!doctype html>
<!-- Static fixture for COMP-07 and LAYOUT-08 (fleet-config#1325): the fixed counterpart of label_fit_broken.html, the same
     dialog laid out so every label sits on one line inside its pill and every control sits inside the card (the shape
     home-automation#860 shipped). It also carries what the two rules must NOT flag: a long prose button that wraps, a
     label truncated with an ellipsis on purpose, and a chip strip that scrolls sideways on its own. Walked at the iPhone
     leg (390px wide). Asserted by tests/test_design_review.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design_review label fit fixture (fixed)</title>
<style>
  html, body { margin: 0; background: #ffffff; color: #1f2328; font-family: system-ui, sans-serif; font-size: 16px; }
  body { padding: 16px; }
  .card { border: 1px solid #d1d9e0; border-radius: 12px; background: #f6f8fa; padding: 12px; overflow: hidden; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 0;
         padding: 0 12px; border: 1px solid #818b98; border-radius: 12px; background: #ffffff; color: #1f2328; font: inherit; font-size: 14px;
         white-space: nowrap; }
  .row.two .btn { flex: 1 1 calc(50% - 3px); }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .prose { display: block; flex: 1 1 100%; height: auto; padding: 10px 12px; text-align: left; white-space: normal; }
  .trunc { flex: 1 1 100%; max-width: 100%; overflow: hidden; text-overflow: ellipsis; justify-content: flex-start; }
  .strip { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0; }
  .strip .btn { flex: none; }
</style>
</head>
<body>
  <main>
    <div class="card" role="dialog" aria-label="Live view">
      <h2>Live view</h2>
      <div class="row two">
        <button type="button" class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>Step</button>
        <button type="button" class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>Zoom in</button>
        <button type="button" class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>Screenshot</button>
        <button type="button" class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>Record</button>
      </div>
      <div class="row">
        <button type="button" class="btn prose">Open the full recording timeline for this camera and review every motion event it caught today</button>
        <button type="button" class="btn trunc"><span style="overflow:hidden;text-overflow:ellipsis">Front door camera, east side, motion detection zone number three</span></button>
      </div>
      <div class="strip">
        <button type="button" class="btn">Preset one</button>
        <button type="button" class="btn">Preset two</button>
        <button type="button" class="btn">Preset three</button>
        <button type="button" class="btn">Preset four</button>
        <button type="button" class="btn">Preset five</button>
      </div>
    </div>
  </main>
</body>
</html>
