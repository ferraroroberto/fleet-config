<!doctype html>
<!-- Static fixture for NAV-05 (fleet-config#1395), a script-written constant: both tabs show the same sentence in every state, but a script wrote it, so the measure cannot tell it from a derived value. Asserted by tests/test_design_review.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design_review header-context script fixture</title>
<style>
  html, body { margin: 0; background: #ffffff; color: #1f2328; font-family: system-ui, sans-serif; font-size: 16px; }
  body { padding: 16px; }
  section[hidden] { display: none; }
  button { font: inherit; min-width: 44px; min-height: 44px; }
  .home-head { display: flex; align-items: center; min-height: 52px; }
  .home-title { font-weight: 700; flex: 1; }
  .status { color: #57606a; }
</style>
<script>
  addEventListener("DOMContentLoaded", () => document.querySelectorAll(".status").forEach(el => { el.textContent = "Manage your jobs."; }));
  addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('[role=tab]').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('[role=tab]').forEach(t => t.setAttribute('aria-selected', String(t === tab)));
      document.querySelectorAll('[role=tabpanel]').forEach(p => p.hidden = (p.id !== tab.getAttribute('aria-controls')));
    }));
  });
</script>
</head>
<body>
  <nav role="tablist" aria-label="Primary">
    <button type="button" role="tab" aria-controls="paneHome" aria-selected="true">Today</button>
    <button type="button" role="tab" aria-controls="paneHistory" aria-selected="false">History</button>
  </nav>
  <main>
    <section id="paneHome" role="tabpanel">
      <div class="home-head"><span class="home-title">Today</span> <span class="status" id="line"></span></div>
      <p>Home pane.</p>
    </section>
    <section id="paneHistory" role="tabpanel" hidden>
      <div class="home-head"><span class="home-title">History</span> <span class="status"></span></div>
      <p>History pane.</p>
    </section>
  </main>
</body>
</html>
