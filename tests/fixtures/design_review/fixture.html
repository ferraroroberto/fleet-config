<!doctype html>
<!-- Static fixture for the design_review browser leg (fleet-config#971).
     Every planted defect below is asserted by tests/test_design_review.py;
     keep the counts in sync with that file. Loaded via file://, no server. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>design_review fixture</title>
<style>
  :root { --fg: #1f2328; --bg: #ffffff; --muted: #656d76; }
  :root[data-theme="dark"] { --fg: #e6edf3; --bg: #0d1117; --muted: #7d8590; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; font-size: 16px; }
  body { padding: 16px; }
  nav.tabs { display: flex; gap: 8px; }
  nav.tabs button { min-width: 60px; min-height: 44px; font: inherit; }
  section[hidden] { display: none; }
  h2 { font-size: 24px; margin: 8px 0; }
  .tiny { font-size: 10px; }
  .caption { font-size: 12px; }
  .faint { color: #b0b0b0; }              /* ~2.2:1 on white -> low contrast */
  .glyph { font-size: 14px; }
  .small-btn { width: 24px; height: 24px; padding: 0; border: 1px solid #d1d9e0; background: #f6f8fa; font: inherit; }
  .hit-target { position: relative; width: 34px; height: 34px; padding: 0; margin: 12px; font: inherit; }
  .hit-target::before { content: ""; position: absolute; inset: -5px; }   /* 34 + 2*5 = 44 effective */
  .ua-font { }                            /* a select with the UA font: no `font: inherit` */
  .big { min-height: 44px; min-width: 88px; font: inherit; }
  svg.i16 { width: 16px; height: 16px; }
  svg.i22 { width: 22px; height: 22px; }
  dialog { border: 1px solid #d1d9e0; border-radius: 12px; }
  dialog button { min-height: 44px; min-width: 88px; font: inherit; }
  dialog summary { min-height: 44px; }
  .faint-border { font: inherit; min-height: 44px; border: 1px solid #e5e5e5; background: #ffffff; }
  .text-only { font: inherit; min-height: 44px; border: 0; background: transparent; color: var(--fg); }
  .wrapped-field { display: inline-flex; height: 44px; border: 1px solid #818b98; }
  .wrapped-field .bare { font: inherit; border: 0; background: transparent; }
  .pill-switch { font: inherit; min-height: 44px; border: 1px solid #e5e5e5; background: transparent; }
  .bare-switch { font: inherit; width: 44px; height: 24px; margin: 10px 0; border: 1px solid #e5e5e5; border-radius: 12px; background: transparent; }
  .arows { list-style: none; padding: 0; }
  .arow { display: flex; gap: 4px; }
  .arow button { font: inherit; min-height: 44px; min-width: 44px; }
  .arow .row-main { flex: 1; }
  #paneList { max-width: 500px; }
  aside.detail { display: none; position: fixed; top: 0; bottom: 0; left: 540px; right: 0; border-left: 1px solid #d1d9e0; }
  body:has(#paneList:not([hidden])) aside.detail { display: block; }
  .segmented { display: flex; gap: 4px; margin: 8px 0; }
  .segmented button { font: inherit; font-size: 12px; min-height: 44px; min-width: 44px; }
  .seg-tall button { white-space: nowrap; }
  .seg-wrap button:first-child { width: 60px; }
  .segmented button { position: relative; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: normal; }
</style>
<script>
  // Minimal tab switcher: aria-controls -> show that pane, hide the others.
  addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('[role=tab]').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('[role=tab]').forEach(t => t.setAttribute('aria-selected', String(t === tab)));
      document.querySelectorAll('[role=tabpanel]').forEach(p => p.hidden = (p.id !== tab.getAttribute('aria-controls')));
    }));
  });
</script>
</head>
<body>
  <nav class="tabs" role="tablist" aria-label="Primary">
    <button type="button" role="tab" data-tab="home" aria-controls="paneHome" aria-selected="true">Home</button>
    <button type="button" role="tab" data-tab="list" aria-controls="paneList" aria-selected="false">List</button>
  </nav>
  <main>
    <section id="paneHome" role="tabpanel">
      <h2>Home</h2>
      <p>Body copy at sixteen pixels with proper contrast.</p>
      <p class="caption">A caption at twelve pixels.</p>
      <p class="tiny">Ten pixel legal text.</p>
      <p class="faint">Faint text under AA.</p>
      <p class="glyph">Next → step</p>
      <button type="button" class="small-btn" aria-label="Tiny">x</button>
      <button type="button" class="hit-target" aria-label="Expanded">o</button>
      <button type="button" class="big"></button>
      <select class="ua-font"><option>UA font select</option></select>
      <svg class="i16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>
      <svg class="i22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>
      <details><summary>More</summary><p>Hidden until open: eleven point five.</p></details>
      <!-- COLOR-03 (#996): an input's faint boundary fails 3:1; a text-labelled, borderless button is exempt -->
      <input class="faint-border" aria-label="Faint input">
      <button type="button" class="text-only">Text tab</button>
      <!-- a field whose wrapper draws the control-border boundary (the vendored filter) is not boundary-less;
           a text-labelled role=switch pill is exempt, a bare switch track with a faint edge is not -->
      <label class="wrapped-field"><input class="bare" aria-label="Wrapped input"></label>
      <button type="button" class="pill-switch" role="switch" aria-checked="false">Detached</button>
      <button type="button" class="bare-switch" role="switch" aria-checked="false" aria-label="Bare switch"></button>
    </section>
    <section id="paneList" role="tabpanel" hidden>
      <h2>List</h2>
      <ul>
        <li>Row one <button type="button" class="big">A</button></li>
        <li>Row two <button type="button" class="big">B</button></li>
      </ul>
      <!-- LAYOUT-03 (#996): the row's own full-width main control is the row itself; star + Run + kebab
           is action-row's budget (1 leading toggle, 1 extra action, 1 trailing accessory); a fourth is over -->
      <ul class="arows">
        <li class="arow arow-ok"><button type="button" aria-label="Favourite">F</button><button type="button" class="row-main">Budget row</button><button type="button">Run</button><button type="button" aria-label="More">M</button></li>
        <li class="arow arow-over"><button type="button" class="row-main">Crowded row</button><button type="button">A</button><button type="button">B</button><button type="button">C</button><button type="button">D</button></li>
      </ul>
      <!-- two expanded targets touching: 34px boxes, -5px expansion each -> 10px overlap -->
      <div style="display:flex;gap:0"><button type="button" class="hit-target" style="margin-right:0" aria-label="One">1</button><button type="button" class="hit-target" style="margin-left:0" aria-label="Two">2</button></div>
      <!-- COMP-03 (#997): five single-line segments made 44px tall by min-height (one carrying an
           sr-only span that wraps word by word in its 1px box) -> not wrapped;
           a narrow segment whose label really breaks onto two lines -> wrapped -->
      <div class="segmented seg-tall" role="radiogroup" aria-label="Tall"><button type="button" role="radio">Needs you</button><button type="button" role="radio">Your turn</button><button type="button" role="radio">Running</button><button type="button" role="radio">Done today</button><button type="button" role="radio">All<span class="sr-only"> sessions in every state</span></button></div>
      <div class="segmented seg-wrap" role="radiogroup" aria-label="Wrap"><button type="button" role="radio">Two line label</button><button type="button" role="radio">One</button></div>
    </section>
  </main>
  <!-- LAYOUT-06 (#996): the list tab is list-and-detail -- a narrow list pane with a fixed,
       full-height detail pane beside it, outside the tabpanel -->
  <aside class="detail" aria-label="Detail"></aside>
  <dialog id="editDialog">
    <h2>Edit</h2>
    <p>Dialog body text.</p>
    <!-- #998: a closed disclosure the dialog walk never opens; engines still lay its content out
         with real boxes, so nothing inside may reach any measured section -->
    <details class="collapsed"><summary>Advanced</summary><input id="hiddenField" aria-label="Hidden field"><p class="faint">Faint and collapsed.</p></details>
    <button type="button">Close</button>
  </dialog>
</body>
</html>
