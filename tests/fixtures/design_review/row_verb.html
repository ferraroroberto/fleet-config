<!doctype html>
<!-- Static fixture for COMP-14 (fleet-config#1420). A verb inside a list row draws nothing at rest. Fails: a tint-filled
     text verb, an outlined text verb (the retired Stop), a tint-filled glyph verb, an outlined glyph verb, a verb with
     a drop shadow, and a lone row's tint verb (a row is a row, whatever its siblings). Passes: a plain glyph verb, a
     plain cluster, a kebab, a leading favourite in its pressed state, a switch, the row's own tap-target button, a
     painted button OUTSIDE a list row (a page action), and a painted button in a menu or nav list. COMP-15
     (fleet-config#1420, owner decision 2026-10-14): a visible Delete or Remove control on a row fails, in a page list or in a
     sheet's editing list (the dialog the walk opens as its own screen): an icon button named Remove, a trash glyph, a text Delete, two rows of a dialog's list. A
     kebab, an Edit verb, a page-level Delete all and a Delete menu item do not. COMP-14 exempts a disclosure
     (fleet-config#1429, owner decision 2026-10-14): a painted chip whose whole label is a count ("+3 more", "+12")
     reveals more of the same row and acts on nothing, so it passes (p-more, p-count); a painted verb chip on the same
     row still fails (f-more-verb), and so does a painted chip that merely starts with a plus (f-plus-verb). Asserted by
     tests/test_design_review.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design_review row verb fixture</title>
<style>
  html, body { margin: 0; background: #ffffff; color: #1f2328; font-family: system-ui, sans-serif; font-size: 16px; }
  body { padding: 16px; }
  h2 { font-size: 16px; margin: 16px 0 4px; }
  ul { list-style: none; margin: 0 0 8px; padding: 0; }
  li.row { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 4px 0; border-top: 1px solid #d1d9e0; }
  .main { flex: 1; min-width: 0; text-align: left; background: none; border: 0; font: inherit; padding: 8px 0; }
  .t { display: block; font-weight: 600; }
  .m { display: block; font-size: 14px; color: #656d76; }
  button.ib { width: 44px; height: 44px; background: none; border: 0; color: #656d76; padding: 0; display: grid; place-items: center; }
  button.ib svg { width: 16px; height: 16px; }
  .group { display: flex; gap: 0; }
  .tint { background: #ddf4ff; border: 1px solid #54aeff66; color: #0969da; height: 44px; padding: 0 12px; border-radius: 8px; font: inherit; }
  .outl { background: transparent; border: 1px solid #d1d9e0; color: #656d76; height: 44px; padding: 0 12px; border-radius: 8px; font: inherit; }
  .shadowed { background: none; border: 0; box-shadow: 0 2px 6px rgba(0,0,0,.35); width: 44px; height: 44px; border-radius: 8px; }
  .chip { background: #ddf4ff; border: 1px solid #54aeff66; color: #0969da; height: 24px; padding: 0 8px; border-radius: 12px; font: inherit; font-size: 14px; }
  .page { background: #0969da; color: #fff; border: 0; padding: 8px 16px; border-radius: 8px; font: inherit; }
  [role=switch] { width: 44px; height: 24px; border-radius: 12px; border: 0; background: #1f6feb; }
  [aria-pressed=true] { background: #ddf4ff; }
  [role=menu] { border: 1px solid #d1d9e0; padding: 4px; }
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><symbol id="g" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></symbol></svg>

<h2>Fails</h2>
<ul>
  <li class="row" id="f-tint-text"><button class="main"><span class="t">Hub A</span><span class="m">Stopped</span></button><button class="tint">Start</button></li>
  <li class="row" id="f-outl-text"><button class="main"><span class="t">Hub B</span><span class="m">Running</span></button><button class="outl">Stop</button></li>
  <li class="row" id="f-tint-glyph"><button class="main"><span class="t">Hub C</span><span class="m">Stopped</span></button><button class="ib" style="background:#ddf4ff" aria-label="Start"><svg><use href="#g"/></svg></button></li>
  <li class="row" id="f-outl-glyph"><button class="main"><span class="t">Hub D</span><span class="m">Running</span></button><button class="ib" style="border:1px solid #d1d9e0;border-radius:8px" aria-label="Stop"><svg><use href="#g"/></svg></button></li>
  <li class="row" id="f-shadow"><button class="main"><span class="t">Hub E</span><span class="m">Running</span></button><button class="shadowed" aria-label="Wake"><svg width="16" height="16"><use href="#g"/></svg></button></li>
</ul>
<ul>
  <li class="row" id="f-lone"><button class="main"><span class="t">Hub F</span><span class="m">Stopped</span></button><button class="tint">Wake</button></li>
</ul>

<ul>
  <li class="row" id="f-more-verb"><button class="main"><span class="t">Report A</span><span class="m">3 files</span></button><button class="chip">Archive</button><button class="chip">+3 more</button></li>
  <li class="row" id="f-plus-verb"><button class="main"><span class="t">Report B</span><span class="m">3 files</span></button><button class="chip">+ Add</button></li>
</ul>

<h2>Passes</h2>
<ul>
  <li class="row" id="p-plain"><button class="main"><span class="t">Cam A</span><span class="m">Idle</span></button><button class="ib" aria-label="Live"><svg><use href="#g"/></svg></button><button class="ib" aria-label="More actions" aria-haspopup="menu" aria-expanded="false"><svg><use href="#g"/></svg></button></li>
  <li class="row" id="p-group"><button class="main"><span class="t">Blind A</span><span class="m">Open</span></button><span class="group" role="group" aria-label="Blind"><button class="ib" aria-label="Up"><svg><use href="#g"/></svg></button><button class="ib" aria-label="Stop"><svg><use href="#g"/></svg></button><button class="ib" aria-label="Down"><svg><use href="#g"/></svg></button></span></li>
  <li class="row" id="p-fav"><button class="ib" aria-pressed="true" aria-label="Favorite"><svg><use href="#g"/></svg></button><button class="main"><span class="t">Job A</span><span class="m">Yesterday</span></button><button class="ib" aria-label="Run"><svg><use href="#g"/></svg></button></li>
  <li class="row" id="p-more"><button class="main"><span class="t">Report C</span><span class="m">5 files</span></button><button class="chip" title="3 more file(s)">+3 more</button></li>
  <li class="row" id="p-count"><button class="main"><span class="t">Report D</span><span class="m">5 files</span></button><button class="chip">+12</button></li>
  <li class="row" id="p-switch"><button class="main"><span class="t">Plug A</span><span class="m">On</span></button><button role="switch" aria-checked="true" aria-label="Plug A"></button></li>
</ul>

<h2>Delete and Remove on a row (COMP-15)</h2>
<ul>
  <li class="row" id="d-icon"><button class="main"><span class="t">Milk</span><span class="m">Dairy</span></button><button class="ib" aria-label="Remove Milk"><svg><use href="#g"/></svg></button></li>
  <li class="row" id="d-glyph"><button class="main"><span class="t">Eggs</span><span class="m">Dairy</span></button><button class="ib" aria-label="Item"><svg><use href="#i-trash"/></svg></button></li>
  <li class="row" id="d-text"><button class="main"><span class="t">Rice</span><span class="m">Dry</span></button><button class="ib" style="width:auto;padding:0 8px">Delete</button></li>
</ul>
<dialog id="sheet" aria-label="Quick add" style="border:1px solid #d1d9e0;padding:8px">
  <ul>
    <li class="row" id="d-sheet-a"><span class="t">Apples</span><button class="ib" title="Remove"><svg><use href="#g"/></svg></button></li>
    <li class="row" id="d-sheet-b"><span class="t">Pears</span><button class="ib" aria-label="Remove"><svg><use href="#g"/></svg></button></li>
  </ul>
</dialog>
<ul>
  <li class="row" id="p-kebab-only"><button class="main"><span class="t">Beans</span><span class="m">Dry</span></button><button class="ib" aria-label="More actions" aria-haspopup="menu" aria-expanded="false"><svg><use href="#g"/></svg></button></li>
  <li class="row" id="p-edit"><button class="main"><span class="t">Salt</span><span class="m">Dry</span></button><button class="ib" aria-label="Edit"><svg><use href="#g"/></svg></button></li>
</ul>

<h2>Not rows</h2>
<p><button class="page" id="n-delete-all">Delete all</button></p>
<ul role="menu" id="n-menu-delete"><li><button role="menuitem" class="ib" style="width:auto">Delete</button></li><li><button role="menuitem" class="ib" style="width:auto">Rename</button></li></ul>
<p><button class="page" id="n-page">Add task</button></p>
<ul role="menu" id="n-menu"><li><button class="tint">Delete</button></li><li><button class="tint">Rename</button></li></ul>
<nav id="n-nav"><ul><li><button class="tint">Home</button></li><li><button class="tint">Jobs</button></li></ul></nav>
</body>
</html>
