<!doctype html>
<!-- Static fixture for walk coverage of overlay surfaces (fleet-config#1353): a surface present in the DOM that no
     walked screen showed open is listed as "not walked". `#taskDrawer` is opened by a declared extra_steps click,
     `#confirmDialog` by the walk's own showModal() pass over `dialog[id]`, and `#itemSheet` by nothing the walk does:
     it is the one surface reported. The `?more` variant adds an id-less <dialog> and a [popover] nothing opens, both
     reported too. Drawer state classes (`.is-open`) never change a surface's key. Asserted by tests/test_design_review.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design_review overlay coverage fixture</title>
<style>
  html, body { margin: 0; background: #ffffff; color: #1f2328; font-family: system-ui, sans-serif; font-size: 16px; }
  body { padding: 16px; }
  [role=tablist] { display: flex; gap: 8px; }
  [role=tab], button { min-height: 44px; min-width: 44px; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; padding: 16px; background: #ffffff; border-left: 1px solid #d0d7de; }
  .drawer[hidden] { display: none; }
</style>
</head>
<body>
  <div role="tablist"><button type="button" role="tab" aria-selected="true" data-tab="home">Home</button></div>
  <main id="home">
    <h2>Home</h2>
    <p>Page content.</p>
    <button type="button" id="openDrawer">Open task</button>
    <button type="button" id="openSheet">Open item</button>
  </main>
  <aside id="taskDrawer" class="drawer" role="dialog" aria-label="Task" hidden><h2>Task</h2><p>Drawer body.</p></aside>
  <aside id="itemSheet" class="drawer sheet" role="dialog" aria-label="Item" hidden><h2>Item</h2><p>Sheet body.</p></aside>
  <dialog id="confirmDialog"><p>Are you sure?</p><button type="button">OK</button></dialog>
<script>
  document.getElementById("openDrawer").addEventListener("click", () => {
    const d = document.getElementById("taskDrawer");
    d.hidden = false;
    d.classList.add("is-open");
  });
  document.getElementById("openSheet").addEventListener("click", () => { document.getElementById("itemSheet").hidden = false; });
  if (location.search.includes("more")) {
    const editor = document.createElement("dialog");
    editor.className = "item-editor";
    editor.innerHTML = "<p>Editor</p>";
    document.body.appendChild(editor);
    const tip = document.createElement("div");
    tip.id = "tipPop";
    tip.setAttribute("popover", "");
    tip.textContent = "Tip";
    document.body.appendChild(tip);
  }
</script>
</body>
</html>
