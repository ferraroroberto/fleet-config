<!doctype html>
<!-- Fixture for LAYOUT-10, a glance card that changes height as late reads land (fleet-config#1354): the grocery
     full-app review found a tab's first card growing row by row as its reads came back, pushing the list down
     under the thumb. design.md's glance card contract: every row is drawn at once, a dash for a value still loading.
     Served over loopback by tests/test_design_review.py, whose `/late?ms=N` answers after N ms; `?case=` picks the page.
     Each case has two tabs: Today reads at load, History reads when its tab is clicked (the tracker has to see the
     click's first paint without the walk racing it).
       fail     both cards draw a title, then append three rows when their read lands; Today's read takes 5 s, past the
                walk's fixed settle, so only the network-idle wait sees it land -> two screens grow
       pass     the same cards drawn with every row at first paint, a dash (and a spinning glyph) for each value,
                filled in place when the read lands -> no growth
       shrink   a tall "Reading..." block replaced by one row when the read lands -> shorter, never a finding
       animate  Today's card grows in from nothing over 700 ms (a max-height entry animation), History's scales in;
                both then fill in place -> the entrance is not growth
       hang     Today's read never answers within the walk's idle bound -> unmeasured, never a pass, and the walk
                does not hang
       cols     the fail cards in the left column of a two-column pane (half its width, like a wide desktop view),
                under a row of two painted lanes across the pane, each holding a bordered figure as wide as the lane
                (half the pane, like a board's lanes), with the tab's list under the card -> the lanes and their
                insides are not the card, the card is found in its column and both screens grow
       last     the fail cards with nothing under them: a card that is its pane's last content moves nothing as
                it grows -> not applicable
       none     no card under either header, only a paragraph -> not applicable
     Asserted by tests/test_design_review.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>design_review glance shift fixture</title>
<style>
  :root { --canvas: #f6f8fa; --card: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; }
  @media (prefers-color-scheme: dark) { :root { --canvas: #0d1117; --card: #161b22; --fg: #f0f6fc; --muted: #9198a1; --border: #3d444d; } }
  html, body { margin: 0; background: var(--canvas); color: var(--fg); font-family: system-ui, sans-serif; font-size: 16px; }
  body { padding: 16px; max-width: 640px; }
  section[hidden] { display: none; }
  button { font: inherit; min-width: 44px; min-height: 44px; }
  .home-head { display: flex; align-items: center; min-height: 52px; }
  .home-title { font-weight: 700; flex: 1; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .tiles { display: flex; gap: 8px; } .tile { flex: 1; background: var(--card); border-radius: 12px; padding: 4px; }
  .tile-figure { min-height: 56px; border: 1px solid var(--border); border-radius: 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; margin-top: 12px; overflow: hidden; }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .row { display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-top: 1px solid var(--border); }
  .reading { min-height: 132px; display: flex; align-items: center; color: var(--muted); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted); border-right-color: transparent; border-radius: 50%;
          animation: spin 800ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grow-in { animation: grow-in 700ms ease-out; }
  @keyframes grow-in { from { max-height: 0; } to { max-height: 400px; } }
  .scale-in { animation: scale-in 700ms ease-out; transform-origin: top; }
  @keyframes scale-in { from { transform: scaleY(0.2); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
<script>
  const CASE = new URLSearchParams(location.search).get('case') || 'fail';
  const READ_MS = {today: CASE === 'hang' ? 120000 : 5000, history: 300};
  const NAMES = ['Audit', 'Carts', 'Prices'];
  const late = (ms) => fetch(`/late?ms=${ms}`).then(r => r.json());
  const rowHtml = (name, value, extra = '') => `<div class="row"><span>${name}</span><span>${extra}${value}</span></div>`;

  // Draw one tab's card, then fill it when its read lands. What the card looks like before and after is the case.
  function draw(which) {
    const host = document.getElementById(`body-${which}`);
    if (CASE === 'none') { host.innerHTML = '<p>Nothing to glance at on this tab.</p>'; return; }
    const entry = CASE === 'animate' ? (which === 'today' ? ' grow-in' : ' scale-in') : '';
    if (CASE === 'pass' || CASE === 'animate') {
      host.innerHTML = `<section class="card${entry}" id="card-${which}"><h2>This week</h2>`
        + NAMES.map(n => rowHtml(n, '–', CASE === 'pass' ? '<span class="spin"></span> ' : '')).join('') + '</section>';
      late(READ_MS[which]).then(() => { host.querySelectorAll('.row span:last-child').forEach((v, i) => { v.textContent = `${i + 3} items`; }); });
    } else if (CASE === 'shrink') {
      host.innerHTML = `<section class="card" id="card-${which}"><h2>This week</h2><div class="reading">Reading…</div></section>`;
      late(READ_MS[which]).then(() => { host.querySelector('.reading').outerHTML = rowHtml('Audit', '3 items'); });
    } else {
      host.innerHTML = `<section class="card" id="card-${which}"><h2>This week</h2></section>`;
      late(READ_MS[which]).then(() => { host.querySelector('.card').insertAdjacentHTML('beforeend', NAMES.map((n, i) => rowHtml(n, `${i + 3} items`)).join('')); });
    }
  }

  addEventListener('DOMContentLoaded', () => {
    if (CASE === 'last') document.querySelectorAll('.below').forEach(b => b.remove());
    if (CASE === 'cols') document.querySelectorAll('[role=tabpanel]').forEach(pane => {
      const cols = document.createElement('div'), left = document.createElement('div'), right = document.createElement('div');
      cols.className = 'cols'; right.innerHTML = '<p>The other column.</p>';
      const tiles = document.createElement('div'); tiles.className = 'tiles';
      tiles.innerHTML = '<div class="tile"><div class="tile-figure"></div></div>'.repeat(2);
      pane.querySelectorAll('[id^=body-], .below').forEach(el => left.appendChild(el));
      cols.append(left, right); pane.append(tiles, cols); });
    draw('today');
    let historyDrawn = false;
    document.querySelectorAll('[role=tab]').forEach(tab => tab.addEventListener('click', () => {
      document.querySelectorAll('[role=tab]').forEach(t => t.setAttribute('aria-selected', String(t === tab)));
      document.querySelectorAll('[role=tabpanel]').forEach(p => p.hidden = (p.id !== tab.getAttribute('aria-controls')));
      if (tab.getAttribute('aria-controls') === 'paneHistory' && !historyDrawn) { historyDrawn = true; draw('history'); }
    }));
  });
</script>
</head>
<body>
  <nav role="tablist" aria-label="Primary">
    <button type="button" role="tab" aria-controls="paneToday" aria-selected="true">Today</button>
    <button type="button" role="tab" aria-controls="paneHistory" aria-selected="false">History</button>
  </nav>
  <main>
    <section id="paneToday" role="tabpanel">
      <div class="home-head"><span class="home-title">Today</span></div>
      <div id="body-today"></div>
      <p class="below">The tab's list sits under the card.</p>
    </section>
    <section id="paneHistory" role="tabpanel" hidden>
      <div class="home-head"><span class="home-title">History</span></div>
      <div id="body-history"></div>
      <p class="below">The tab's list sits under the card.</p>
    </section>
  </main>
</body>
</html>
