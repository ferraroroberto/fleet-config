# design.rubric.toml — the /design-review rubric (fleet-config#970, #971).
#
# Beside design.md / design.dark.md, versioned on its own. Every rule here is
# data: a stable id, the rendered metric it reads (skills/_lib/design_review/
# measure.py, or a derived metric in evaluate.py), the comparison that makes
# it fail, a severity, the standard it cites, a fix template, an owner
# (spec | scaffold | app) and a mock-up id — a key into the now-vs-proposed
# library in skills/_lib/design_review/mockups.py, or "none"; validation
# refuses an id the library does not have (#972). No LLM assigns a grade:
# evaluate.py applies [penalties] once per failing rule and maps the score
# through [grades]; [weights] blend the categories into the overall verdict.
#
# Thresholds resolve from design.md tokens where one exists (`threshold_token`,
# `[params.*].token`, read through design_lint/spec.py), else from the literal.
# `fail_when` reads "the rule FAILS when metric <op> threshold"; `true` and
# `nonzero` ignore the threshold. `devices` / `screens` restrict where a rule
# applies. Rules the walk cannot measure on a screen report `unmeasured`.
#
# Kept flat so #973 can append `[[judgment]]` entries without restructuring.
# Bump [meta].version on any rule change: it is stamped on every metrics.json,
# every evaluate output and every filed finding.

[meta]
version = "1.1.0"   # 1.1.0: mock-up ids aligned to the #972 library (no threshold or severity change)
seeded_from = "app-launcher rendered audit, 2026-09-21 (fleet-config#962)"

[weights]
typography = 1.0
color = 1.0
touch = 1.0
navigation = 0.5
layout = 1.0
components = 0.5
a11y = 1.0

# Minimum score for each letter; F is the floor.
[grades]
A = 90
B = 80
C = 70
D = 60
F = 0

# Deducted from 100 once per failing rule of that severity, never per instance.
[penalties]
P0 = 25
P1 = 12
P2 = 6
P3 = 2

# Measurement floors the in-page script needs before it runs.
[params.hit_min]
token = "components.hit-target.min"
default = 44

[params.primary_min]
token = "components.button-primary.height"
default = 48

[params.icon_steps]
token = "icons.size"
default = [16, 18, 20, 24]

# ---------------------------------------------------------------------------
# Typography

[[rules]]
id = "TYPE-01"
category = "typography"
title = "Share of text runs under 14px exceeds 40% on a screen"
metric = "text.under14_share"
fail_when = "gt"
threshold = 0.40
severity = "P1"
owner = "spec"
standard = "Apple HIG Typography: 17pt body; WCAG 1.4.4 Resize Text"
fix_template = "Raise the body scale: {share:.0%} of text runs on {screen} render under 14px. Move secondary text from caption to label size."
mockup = "type-scale"

[[rules]]
id = "TYPE-02"
category = "typography"
title = "A form control's computed font-family differs from the body's"
metric = "controls.font_family_mismatch_count"
fail_when = "gt"
threshold = 0
severity = "P0"
owner = "scaffold"
standard = "design.md typography.body; UA default form-control font reset"
fix_template = "{count} form controls on {screen} inherit the UA font. Add `button, input, select, textarea {{ font: inherit; }}` to the shared base stylesheet."
mockup = "none"

[[rules]]
id = "TYPE-03"
category = "typography"
title = "Any text run under 11px"
metric = "text.min_px"
fail_when = "lt"
threshold = 11
severity = "P1"
owner = "app"
standard = "Apple HIG: 11pt minimum on iOS; Material: 11sp caption floor"
fix_template = "Text at {value}px on {screen} ({sample}); floor is 11px."
mockup = "none"

[[rules]]
id = "TYPE-04"
category = "typography"
title = "A name wraps mid-word (word-break: break-all on a non-path selector)"
metric = "text.break_all_non_path"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "CSS Text 3: overflow-wrap: anywhere for long tokens, break-all only for opaque strings"
fix_template = "{count} text nodes on {screen} use word-break: break-all outside a path/hash selector; use overflow-wrap: anywhere."
mockup = "none"
params = { allow = "path|url|sha|hash|mono|code" }

[[rules]]
id = "TYPE-05"
category = "typography"
title = "text-transform: uppercase outside the legalized role"
metric = "text.uppercase_outside_role"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "design.md typography: no uppercase labels; badges/eyebrows excepted"
fix_template = "{count} uppercase text runs on {screen} outside badge/tag/kbd selectors."
mockup = "none"
params = { allow = "badge|tag|kbd|eyebrow|abbr" }

# ---------------------------------------------------------------------------
# Color

[[rules]]
id = "COLOR-01"
category = "color"
title = "A text/background pair the spec itself defines computes under 4.5:1"
metric = "spec.pairs_under_aa"
fail_when = "gt"
threshold = 0
severity = "P0"
owner = "spec"
standard = "WCAG 2.2 SC 1.4.3 Contrast (Minimum), computed over colors.card"
fix_template = "Spec pair {component} computes {ratio}:1 ({fg} on {bg}); AA needs {threshold}:1."
mockup = "contrast-swatches"

[[rules]]
id = "COLOR-02"
category = "color"
title = "Rendered text under 4.5:1 (3:1 for large text)"
metric = "text.low_contrast_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "WCAG 2.2 SC 1.4.3"
fix_template = "{count} text runs on {screen} render under AA ({sample})."
mockup = "none"

[[rules]]
id = "COLOR-03"
category = "color"
title = "A control boundary under 3:1 against its surface"
metric = "controls.boundary_low_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "spec"
standard = "WCAG 2.2 SC 1.4.11 Non-text Contrast"
fix_template = "{count} controls on {screen} have a border or fill under 3:1 against their surface ({sample})."
mockup = "form-primary"

# ---------------------------------------------------------------------------
# Touch

[[rules]]
id = "TOUCH-01"
category = "touch"
title = "Share of controls with an effective rect under hit-target.min exceeds 10% on a screen"
metric = "targets.small_share"
fail_when = "gt"
threshold = 0.10
severity = "P0"
owner = "app"
standard = "Apple HIG 44x44pt; WCAG 2.2 SC 2.5.8 Target Size (Minimum); design.md components.hit-target.min"
fix_template = "{count} of {total} controls on {screen} fall under {hit_min}px effective; apply the .hit-target expansion."
mockup = "hit-target"

[[rules]]
id = "TOUCH-02"
category = "touch"
title = "Effective hit rectangles overlap"
metric = "targets.overlap_count"
fail_when = "gt"
threshold = 0
severity = "P0"
owner = "app"
standard = "design.md Touch targets: expanded rects never intersect"
fix_template = "{count} pairs of expanded hit areas overlap on {screen} ({sample}); space the controls or shrink the expansion."
mockup = "none"

[[rules]]
id = "TOUCH-03"
category = "touch"
title = "The view's primary action is smaller than button-primary"
metric = "targets.primary_min_height"
fail_when = "lt"
threshold = 48
threshold_token = "components.button-primary.height"
severity = "P1"
owner = "app"
standard = "design.md components.button-primary.height"
fix_template = "Primary action on {screen} renders {value}px tall; button-primary is {threshold}px."
mockup = "form-primary"

# ---------------------------------------------------------------------------
# Navigation

[[rules]]
id = "NAV-01"
category = "navigation"
title = "More than five primary destinations"
metric = "nav.primary_count"
fail_when = "gt"
threshold = 5
severity = "P1"
owner = "spec"
standard = "Apple HIG Tab bars: 3-5 tabs; Material Navigation bar: 3-5 destinations"
fix_template = "{value} primary tabs; fold the least-used into a More/Settings destination."
mockup = "nav-five"
screens = ["tab"]

[[rules]]
id = "NAV-02"
category = "navigation"
title = "A pane does not open with the page header"
metric = "nav.pane_header_hidden"
fail_when = "nonzero"
severity = "P2"
owner = "app"
standard = "Apple HIG Navigation: a destination opens at its top"
fix_template = "{screen} opens scrolled ({sample}); reset the pane scroll on tab change."
mockup = "none"
screens = ["tab"]

# ---------------------------------------------------------------------------
# Layout

[[rules]]
id = "LAYOUT-01"
category = "layout"
title = "Horizontal page overflow"
metric = "layout.overflow_x"
fail_when = "true"
severity = "P0"
owner = "app"
standard = "WCAG 2.2 SC 1.4.10 Reflow"
fix_template = "{screen} scrolls horizontally ({sample}); the layout must be fluid at this width."
mockup = "none"

[[rules]]
id = "LAYOUT-02"
category = "layout"
title = "A list over 12 rows with no filter in a pane over five viewports tall"
metric = "layout.lists_unfiltered_tall"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "Nielsen: recognition over recall; long lists need a filter"
fix_template = "{count} lists on {screen} exceed 12 rows with no filter in a {viewports}-viewport pane."
mockup = "row-density"
params = { viewports = 5 }

[[rules]]
id = "LAYOUT-03"
category = "layout"
title = "More than two interactive controls per list row besides the row itself"
metric = "layout.rows_over_limit_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "Apple HIG Lists: one primary action per row, secondary actions in a menu"
fix_template = "{count} rows on {screen} carry more than 2 controls ({sample}); move extras into a row menu."
mockup = "action-row"

[[rules]]
id = "LAYOUT-04"
category = "layout"
title = "A danger-styled button repeated on three or more rows of a screen"
metric = "layout.danger_rows"
fail_when = "gte"
threshold = 3
severity = "P1"
owner = "app"
standard = "design.md Colors: danger is state, never decoration"
fix_template = "{value} rows on {screen} each show a danger button; move delete into the row menu or a bulk action."
mockup = "destructive-in-menu"

[[rules]]
id = "LAYOUT-05"
category = "layout"
title = "Interactive controls inside a disclosure summary"
metric = "targets.in_summary"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "HTML: summary is a single toggle; nested controls are ambiguous taps"
fix_template = "{value} controls sit inside <summary> on {screen}; move them into the details body."
mockup = "none"

[[rules]]
id = "LAYOUT-06"
category = "layout"
title = "Content column under 60% of the viewport at 1100px and wider"
metric = "layout.content_share"
fail_when = "lt"
threshold = 0.60
severity = "P2"
owner = "spec"
standard = "design.md desktop measure contract"
fix_template = "Content column is {share:.0%} of a {inner_w}px viewport on {screen}."
mockup = "wide-desktop"
devices = ["desktop"]
screens = ["tab"]
params = { min_viewport = 1100 }

# ---------------------------------------------------------------------------
# Components

[[rules]]
id = "COMP-01"
category = "components"
title = "Arrow or geometric-shape characters used as icons in UI text"
metric = "text.glyph_icon_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "design.md icons: Lucide inline SVG, no glyph icons"
fix_template = "{count} text runs on {screen} use glyph characters as icons ({sample}); replace with the Lucide sprite."
mockup = "none"

[[rules]]
id = "COMP-02"
category = "components"
title = "Icon box off the icons.size steps"
metric = "icons.off_step_count"
fail_when = "gt"
threshold = 0
severity = "P3"
owner = "app"
standard = "design.md icons.size: 16 / 18 / 20 / 24px"
fix_template = "{count} icon boxes on {screen} are off the size steps ({sample})."
mockup = "none"
params = { tolerance_px = 1 }

[[rules]]
id = "COMP-03"
category = "components"
title = "A segmented control with more than five options or a wrapped label"
metric = "controls.segmented_bad_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "Apple HIG Segmented controls: 2-5 segments, single-line labels"
fix_template = "{count} segmented controls on {screen} exceed 5 options or wrap a label ({sample})."
mockup = "none"

[[rules]]
id = "COMP-04"
category = "components"
title = "A UA-styled element (default link colour, bare hr)"
metric = "controls.ua_styled_count"
fail_when = "gt"
threshold = 0
severity = "P3"
owner = "app"
standard = "design.md Colors: one accent for links; hairlines from colors.border"
fix_template = "{count} UA-styled elements on {screen} ({sample})."
mockup = "none"

# ---------------------------------------------------------------------------
# Accessibility

[[rules]]
id = "A11Y-01"
category = "a11y"
title = "An interactive element with no accessible name"
metric = "a11y.unnamed_count"
fail_when = "gt"
threshold = 0
severity = "P0"
owner = "app"
standard = "WCAG 2.2 SC 4.1.2 Name, Role, Value"
fix_template = "{count} controls on {screen} have no accessible name ({sample}); add aria-label."
mockup = "none"

[[rules]]
id = "A11Y-02"
category = "a11y"
title = "Zoom locked and no text-size control"
metric = "a11y.zoom_locked_no_control"
fail_when = "nonzero"
severity = "P1"
owner = "spec"
standard = "WCAG 2.2 SC 1.4.4 Resize Text; Apple HIG: never disable pinch zoom"
fix_template = "meta viewport locks zoom on {screen} and no text-size control exists."
mockup = "none"
