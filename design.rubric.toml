# design.rubric.toml — the /design-review rubric (fleet-config#970, #971).
#
# Beside design.md / design.dark.md, versioned on its own. Every rule here is
# data: a stable id, the rendered metric it reads (skills/_lib/design_review/
# measure.py, or a derived metric in evaluate.py), the comparison that makes
# it fail, a severity, the standard it cites, a fix template, an owner
# (spec | scaffold | app) and a mock-up id — a key into the now-vs-proposed
# library in skills/_lib/design_review/mockups.py, or "none"; validation
# refuses an id the library does not have (#972). No LLM assigns a grade:
# evaluate.py applies [penalties] once per failing rule and maps the score
# through [grades]; [weights] blend the categories into the overall verdict.
#
# Thresholds resolve from design.md tokens where one exists (`threshold_token`,
# `[params.*].token`, read through design_lint/spec.py), else from the literal.
# `fail_when` reads "the rule FAILS when metric <op> threshold"; `true` and
# `nonzero` ignore the threshold. `devices` / `screens` restrict where a rule
# applies. Rules the walk cannot measure on a screen report `unmeasured`.
#
# Kept flat: [[rules]] is what the metrics decide, [[judgment]] (#973) is the
# bounded checklist a fresh-context judge answers yes / no / na per question
# from the local screenshots and metrics.json — never a previous report. Each
# entry has a stable id (J-NN), the question, `maps_to` (the rule ids a `no`
# may land on; empty means a `no` must be emitted as an UNCATALOGUED finding
# with a proposed metric + threshold) and `screens` (all | tabs | dialogs).
# Uncatalogued findings are listed in the report outside the grade.
#
# The ratchet (#973): an uncatalogued finding the user accepts becomes a
# [[rules]] entry (when it can be measured — it then leaves the checklist) or
# a [[judgment]] question, by PR, with a [meta].version bump. No automation
# writes this file.
#
# Bump [meta].version on any rule or question change: it is stamped on every
# metrics.json, every evaluate output and every filed finding.

[meta]
version = "1.5.0"   # 1.5.0: TOUCH-02 counts one layer only (a covered control is not an overlap), LAYOUT-07 bottom-bar clearance (#1019); 1.4.0: LAYOUT-06 list + detail and the measure, LAYOUT-03 action-row budget, COLOR-03 boundary-bearing controls (#996); 1.3.0: TYPE-05 overline-only caps, TYPE-01 fix names body-sm (#992); 1.2.0: [[judgment]] checklist J-01..J-10 (#973); 1.1.0: mock-up ids aligned to the #972 library
seeded_from = "app-launcher rendered audit, 2026-09-21 (fleet-config#962)"

[weights]
typography = 1.0
color = 1.0
touch = 1.0
navigation = 0.5
layout = 1.0
components = 0.5
a11y = 1.0

# Minimum score for each letter; F is the floor.
[grades]
A = 90
B = 80
C = 70
D = 60
F = 0

# Deducted from 100 once per failing rule of that severity, never per instance.
[penalties]
P0 = 25
P1 = 12
P2 = 6
P3 = 2

# Measurement floors the in-page script needs before it runs.
[params.hit_min]
token = "components.hit-target.min"
default = 44

[params.primary_min]
token = "components.button-primary.height"
default = 48

[params.icon_steps]
token = "icons.size"
default = [16, 18, 20, 24]

# LAYOUT-06: a no-detail tab holds the centred measure, less a gutter each side (#996).
[params.measure]
token = "layout.measure"
default = 772

[params.gutter]
token = "spacing.gutter"
default = 12

# LAYOUT-03: action-row's per-row budget besides the row itself, summed (#996).
[params.row_leading_toggles]
token = "components.action-row.leadingToggles"
default = 1

[params.row_trailing_accessories]
token = "components.action-row.trailingAccessories"
default = 1

[params.row_extra_actions]
token = "components.action-row.extraVisibleActions"
default = 1

# ---------------------------------------------------------------------------
# Typography

[[rules]]
id = "TYPE-01"
category = "typography"
title = "Share of text runs under 14px exceeds 40% on a screen"
metric = "text.under14_share"
fail_when = "gt"
threshold = 0.40
severity = "P1"
owner = "spec"
standard = "Apple HIG Typography: 17pt body; WCAG 1.4.4 Resize Text"
fix_template = "Raise the body scale: {share:.0%} of text runs on {screen} render under 14px. Move secondary lines (paths, status, row meta) to the 14px body-sm role."
mockup = "type-scale"

[[rules]]
id = "TYPE-02"
category = "typography"
title = "A form control's computed font-family differs from the body's"
metric = "controls.font_family_mismatch_count"
fail_when = "gt"
threshold = 0
severity = "P0"
owner = "scaffold"
standard = "design.md typography.body; UA default form-control font reset"
fix_template = "{count} form controls on {screen} inherit the UA font. Add `button, input, select, textarea {{ font: inherit; }}` to the shared base stylesheet."
mockup = "none"

[[rules]]
id = "TYPE-03"
category = "typography"
title = "Any text run under 11px"
metric = "text.min_px"
fail_when = "lt"
threshold = 11
severity = "P1"
owner = "app"
standard = "Apple HIG: 11pt minimum on iOS; Material: 11sp caption floor"
fix_template = "Text at {value}px on {screen} ({sample}); floor is 11px."
mockup = "none"

[[rules]]
id = "TYPE-04"
category = "typography"
title = "A name wraps mid-word (word-break: break-all on a non-path selector)"
metric = "text.break_all_non_path"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "CSS Text 3: overflow-wrap: anywhere for long tokens, break-all only for opaque strings"
fix_template = "{count} text nodes on {screen} use word-break: break-all outside a path/hash selector; use overflow-wrap: anywhere."
mockup = "none"
params = { allow = "path|url|sha|hash|mono|code" }

[[rules]]
id = "TYPE-05"
category = "typography"
title = "text-transform: uppercase outside the overline role"
metric = "text.uppercase_outside_role"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "design.md typography: caps only through the overline role (list group headers); chips and badges are sentence case"
fix_template = "{count} uppercase text runs on {screen} outside the overline role ({sample}); set chips and badges in sentence case."
mockup = "none"
params = { allow = "overline" }

# ---------------------------------------------------------------------------
# Color

[[rules]]
id = "COLOR-01"
category = "color"
title = "A text/background pair the spec itself defines computes under 4.5:1"
metric = "spec.pairs_under_aa"
fail_when = "gt"
threshold = 0
severity = "P0"
owner = "spec"
standard = "WCAG 2.2 SC 1.4.3 Contrast (Minimum), computed over colors.card"
fix_template = "Spec pair {component} computes {ratio}:1 ({fg} on {bg}); AA needs {threshold}:1."
mockup = "contrast-swatches"

[[rules]]
id = "COLOR-02"
category = "color"
title = "Rendered text under 4.5:1 (3:1 for large text)"
metric = "text.low_contrast_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "WCAG 2.2 SC 1.4.3"
fix_template = "{count} text runs on {screen} render under AA ({sample})."
mockup = "none"

[[rules]]
id = "COLOR-03"
category = "color"
title = "An input, select, textarea or switch boundary under 3:1 against its surface"
metric = "controls.boundary_low_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "spec"
standard = "WCAG 2.2 SC 1.4.11 Non-text Contrast; design.md control-border (text-labelled buttons and tabs are identified by their label)"
fix_template = "{count} controls on {screen} have a border or fill under 3:1 against their surface ({sample})."
mockup = "form-primary"

# ---------------------------------------------------------------------------
# Touch

[[rules]]
id = "TOUCH-01"
category = "touch"
title = "Share of controls with an effective rect under hit-target.min exceeds 10% on a screen"
metric = "targets.small_share"
fail_when = "gt"
threshold = 0.10
severity = "P0"
owner = "app"
standard = "Apple HIG 44x44pt; WCAG 2.2 SC 2.5.8 Target Size (Minimum); design.md components.hit-target.min"
fix_template = "{count} of {total} controls on {screen} fall under {hit_min}px effective; apply the .hit-target expansion."
mockup = "hit-target"

[[rules]]
id = "TOUCH-02"
category = "touch"
title = "Effective hit rectangles overlap within one layer"
metric = "targets.overlap_count"
fail_when = "gt"
threshold = 0
severity = "P0"
owner = "app"
standard = "design.md Touch targets: expanded rects never intersect (a control covered by a fixed layer where they meet takes no tap, so the pair is not counted)"
fix_template = "{count} pairs of expanded hit areas overlap on {screen} ({sample}); space the controls or shrink the expansion."
mockup = "none"

[[rules]]
id = "TOUCH-03"
category = "touch"
title = "The view's primary action is smaller than button-primary"
metric = "targets.primary_min_height"
fail_when = "lt"
threshold = 48
threshold_token = "components.button-primary.height"
severity = "P1"
owner = "app"
standard = "design.md components.button-primary.height"
fix_template = "Primary action on {screen} renders {value}px tall; button-primary is {threshold}px."
mockup = "form-primary"

# ---------------------------------------------------------------------------
# Navigation

[[rules]]
id = "NAV-01"
category = "navigation"
title = "More than five primary destinations"
metric = "nav.primary_count"
fail_when = "gt"
threshold = 5
severity = "P1"
owner = "spec"
standard = "Apple HIG Tab bars: 3-5 tabs; Material Navigation bar: 3-5 destinations"
fix_template = "{value} primary tabs; fold the least-used into a More/Settings destination."
mockup = "nav-five"
screens = ["tab"]

[[rules]]
id = "NAV-02"
category = "navigation"
title = "A pane does not open with the page header"
metric = "nav.pane_header_hidden"
fail_when = "nonzero"
severity = "P2"
owner = "app"
standard = "Apple HIG Navigation: a destination opens at its top"
fix_template = "{screen} opens scrolled ({sample}); reset the pane scroll on tab change."
mockup = "none"
screens = ["tab"]

# ---------------------------------------------------------------------------
# Layout

[[rules]]
id = "LAYOUT-01"
category = "layout"
title = "Horizontal page overflow"
metric = "layout.overflow_x"
fail_when = "true"
severity = "P0"
owner = "app"
standard = "WCAG 2.2 SC 1.4.10 Reflow"
fix_template = "{screen} scrolls horizontally ({sample}); the layout must be fluid at this width."
mockup = "none"

[[rules]]
id = "LAYOUT-02"
category = "layout"
title = "A list over 12 rows with no filter in a pane over five viewports tall"
metric = "layout.lists_unfiltered_tall"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "Nielsen: recognition over recall; long lists need a filter"
fix_template = "{count} lists on {screen} exceed 12 rows with no filter in a {viewports}-viewport pane."
mockup = "row-density"
params = { viewports = 5 }

[[rules]]
id = "LAYOUT-03"
category = "layout"
title = "More interactive controls per list row, besides the row itself, than action-row allows (toggle + action + accessory)"
metric = "layout.rows_over_limit_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "Apple HIG Lists: one primary action per row, secondary actions in a menu; design.md action-row"
fix_template = "{count} rows on {screen} carry more controls than action-row allows ({sample}); move extras into a row menu."
mockup = "action-row"

[[rules]]
id = "LAYOUT-04"
category = "layout"
title = "A danger-styled button repeated on three or more rows of a screen"
metric = "layout.danger_rows"
fail_when = "gte"
threshold = 3
severity = "P1"
owner = "app"
standard = "design.md Colors: danger is state, never decoration"
fix_template = "{value} rows on {screen} each show a danger button; move delete into the row menu or a bulk action."
mockup = "destructive-in-menu"

[[rules]]
id = "LAYOUT-05"
category = "layout"
title = "Interactive controls inside a disclosure summary"
metric = "targets.in_summary"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "HTML: summary is a single toggle; nested controls are ambiguous taps"
fix_template = "{value} controls sit inside <summary> on {screen}; move them into the details body."
mockup = "none"

[[rules]]
id = "LAYOUT-06"
category = "layout"
title = "Content (list + detail) under 60% of the viewport at 1100px and wider, outside the centred measure"
metric = "layout.content_share"
fail_when = "lt"
threshold = 0.60
severity = "P2"
owner = "spec"
standard = "design.md Layout: wide layout, master-detail and the 772px measure"
fix_template = "Content column is {share:.0%} of a {inner_w}px viewport on {screen}."
mockup = "wide-desktop"
devices = ["desktop"]
screens = ["tab"]
params = { min_viewport = 1100 }

[[rules]]
id = "LAYOUT-07"
category = "layout"
title = "A list's last row stays under a fixed bottom bar at full scroll"
metric = "clearance.hidden_row_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "Apple HIG Tab bars: scrolling content clears the bar; design.md navigation contract (floating bottom-tab pill)"
fix_template = "{count} lists on {screen} end under a fixed bottom bar at full scroll ({sample}); pad the scroller's end by the bar's height."
mockup = "none"

# ---------------------------------------------------------------------------
# Components

[[rules]]
id = "COMP-01"
category = "components"
title = "Arrow or geometric-shape characters used as icons in UI text"
metric = "text.glyph_icon_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "design.md icons: Lucide inline SVG, no glyph icons"
fix_template = "{count} text runs on {screen} use glyph characters as icons ({sample}); replace with the Lucide sprite."
mockup = "none"

[[rules]]
id = "COMP-02"
category = "components"
title = "Icon box off the icons.size steps"
metric = "icons.off_step_count"
fail_when = "gt"
threshold = 0
severity = "P3"
owner = "app"
standard = "design.md icons.size: 16 / 18 / 20 / 24px"
fix_template = "{count} icon boxes on {screen} are off the size steps ({sample})."
mockup = "none"
params = { tolerance_px = 1 }

[[rules]]
id = "COMP-03"
category = "components"
title = "A segmented control with more than five options or a wrapped label"
metric = "controls.segmented_bad_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "Apple HIG Segmented controls: 2-5 segments, single-line labels"
fix_template = "{count} segmented controls on {screen} exceed 5 options or wrap a label ({sample})."
mockup = "none"

[[rules]]
id = "COMP-04"
category = "components"
title = "A UA-styled element (default link colour, bare hr)"
metric = "controls.ua_styled_count"
fail_when = "gt"
threshold = 0
severity = "P3"
owner = "app"
standard = "design.md Colors: one accent for links; hairlines from colors.border"
fix_template = "{count} UA-styled elements on {screen} ({sample})."
mockup = "none"

# ---------------------------------------------------------------------------
# Accessibility

[[rules]]
id = "A11Y-01"
category = "a11y"
title = "An interactive element with no accessible name"
metric = "a11y.unnamed_count"
fail_when = "gt"
threshold = 0
severity = "P0"
owner = "app"
standard = "WCAG 2.2 SC 4.1.2 Name, Role, Value"
fix_template = "{count} controls on {screen} have no accessible name ({sample}); add aria-label."
mockup = "none"

[[rules]]
id = "A11Y-02"
category = "a11y"
title = "Zoom locked and no text-size control"
metric = "a11y.zoom_locked_no_control"
fail_when = "nonzero"
severity = "P1"
owner = "spec"
standard = "WCAG 2.2 SC 1.4.4 Resize Text; Apple HIG: never disable pinch zoom"
fix_template = "meta viewport locks zoom on {screen} and no text-size control exists."
mockup = "none"

# ---------------------------------------------------------------------------
# Judgment checklist (#973) — answered yes / no / na by a fresh-context judge
# from the run's local screenshots + metrics.json. `maps_to` lists the rule
# ids a `no` may be attributed to; an empty list means a `no` must be raised
# as an uncatalogued finding with a proposed metric + threshold. `screens`
# scopes the question: all | tabs | dialogs. Each question states what makes
# it a `no` so three independent judges reach the same vector.

[[judgment]]
id = "J-01"
question = "On every tab screen that lists rows, is each row's primary action evident without learning an icon: the row itself is tappable, or its main action carries a visible text label? Answer no if any list's rows expose their main action only as an icon-only button. Answer na if no tab screen lists rows."
maps_to = ["LAYOUT-03", "A11Y-01"]
screens = "tabs"

[[judgment]]
id = "J-02"
question = "On each screen, counting every control visible in the viewport or the full-page screenshot, is the most prominent control — the largest, or any filled button whatever its colour (accent and danger red alike) — the one that performs the screen's main task? Answer no if on any screen a secondary or destructive control is filled or larger while the main task's control is a plain, ghost, outlined or icon-only button. Answer na if no screen has more than one control."
maps_to = ["TOUCH-03"]
screens = "all"

[[judgment]]
id = "J-03"
question = "Counting every control visible in the viewport or the full-page screenshot (collapsed sections appear expanded there), are destructive actions (delete, remove, kill, stop, reset, clear) the least prominent controls on their screen: a plain, ghost, text or outlined button, red text at most, or placed inside a menu? Answer no if any screenshot shows a destructive action as a filled button (accent- or danger-filled), including inside an expanded section of a full-page screenshot, whatever the metrics count. Answer na if no screenshot shows a destructive action."
maps_to = ["LAYOUT-04"]
screens = "all"

[[judgment]]
id = "J-04"
question = "Does each screen read top to bottom in one column at phone width — a title or heading first, then content, then actions? Two separate checks, both must hold for a yes: (1) no iphone or android screenshot places two content blocks (cards, lists, panels) side by side — navigation tabs and a row's own inline controls do not count; (2) on every tab screen the first text read below the app's top bar is a title or section heading, not the label of a button, dropdown or input. Answer no if either check fails on any screen, and name that screen as evidence."
maps_to = []
screens = "all"

[[judgment]]
id = "J-05"
question = "Is every icon-only control (a button showing no visible text) either a conventional glyph whose meaning is fixed by convention (close X, search magnifier, settings gear, plus, chevron, menu, pencil, trash, copy, refresh, play, stop) or placed directly beside a text label that names its object? Answer no if any icon-only control shows a non-conventional glyph with no adjacent label. Answer na if no screen has an icon-only control."
maps_to = ["A11Y-01", "COMP-01"]
screens = "all"

[[judgment]]
id = "J-06"
question = "Do all top-level tab screens share one anatomy: the same header position and title placement, the same bottom navigation, and the same container type for their main content (all cards, or all lists, or all tables)? Answer no if any tab places its header or title differently from the others or wraps its main content in a different container type (for example one tab is a table while the rest are cards)."
maps_to = ["NAV-02"]
screens = "tabs"

[[judgment]]
id = "J-07"
question = "Is every visible label plain words a user of the app would say (Apps, Jobs, Settings, Rename, Delete, Run) rather than an internal name? Labels means all of: button labels, tab labels, section headings, and the labels of form fields, dropdowns and toggles — in tab screens and dialogs alike. Answer no if any such label contains an identifier (UPPER_SNAKE_CASE, a key=value pair), a file path, a code term or an abbreviation not in common use, even inside a parenthesis or helper clause of the label. User-entered content (app names, session names, job names, row metadata) does not count."
maps_to = []
screens = "all"

[[judgment]]
id = "J-08"
question = "Is casing consistent within each class of element — every button label in one style, every heading in one style, every tab label in one style (sentence case throughout or Title Case throughout)? Answer no if one class of element mixes sentence case and Title Case across screens, or uses ALL CAPS outside a badge or tag."
maps_to = ["TYPE-05"]
screens = "all"

[[judgment]]
id = "J-09"
question = "Does every empty list or empty section visible in the screenshots show a sentence saying why it is empty, and either (a) hold a button or link inside the empty-state box itself — the dashed or bordered area that holds the sentence, not the surrounding card or section — or (b) name in that sentence the control elsewhere on the screen that fills it? Answer no if any empty list or section shows nothing, only a dash, or a bare sentence such as 'No items yet' that neither holds a control inside its own box nor names one; a form or button that sits below or beside the box in the same card does not count unless the sentence names it. Answer na if no screenshot shows an empty list or section."
maps_to = []
screens = "tabs"

[[judgment]]
id = "J-10"
question = "In every list, can a row's key fact be read at a glance: the row leads with its name as the row's largest text, its state is a badge or a short word, and the row carries at most one secondary line of text? Answer no if any list's rows lead with an icon, an id or a timestamp instead of the name, or pack more than two lines of text into a row. Answer na if no tab screen lists rows."
maps_to = ["TYPE-01", "LAYOUT-03"]
screens = "tabs"
