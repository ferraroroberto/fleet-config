# design.web.rubric.toml — the page rubric for web pages.
#
# Beside design.web.md, as design.rubric.toml sits beside design.md, and in the
# same schema, so skills/_lib/design_review/rubric.py loads and validates it
# unchanged: [meta], [weights], [grades], [penalties], [params.*], a flat
# [[rules]] array and a [[judgment]] checklist. Every rule is data: a stable id,
# the metric it reads, the comparison that makes it fail ("the rule FAILS when
# metric <fail_when> threshold"; `true` and `nonzero` ignore the threshold), a
# severity, the standard it cites, a fix template, an owner (spec | scaffold |
# app) and a mock-up id ("none" until the mock-up library has web-page
# templates).
#
# Metrics are named for the web-page measurement: `page.*` and `text.*` read
# the rendered page, `seo.*` the built HTML and the site files, `perf.*` a cold
# load on a throttled mobile profile. A rule whose metric is not measured yet
# reports `unmeasured`, never a pass. Thresholds resolve from design.web.md's
# front matter where `threshold_token` names one, else from the literal.
#
# `devices` names the verification matrix of design.web.md: `phone` (390px),
# `tablet` (800px), `desktop` (1440px). A rule with no `devices` applies at all
# three. Per-site checks (sitemap, robots.txt, redirects) are measured once per
# site and reported on every page's run.
#
# The brand is never graded: a rule reads a token's role and floor, not its
# value. Bump [meta].version on any rule or question change.

[meta]
version = "1.1.0"
seeded_from = "robertoferraro.net static rebuild, 2026-11-01"

[weights]
hierarchy = 1.0
readability = 1.0
touch = 1.0
a11y = 1.0
layout = 1.0
components = 0.5
trust = 0.5
seo = 1.0
performance = 1.0

[grades]
A = 90
B = 80
C = 70
D = 60
F = 0

[penalties]
P0 = 25
P1 = 12
P2 = 6
P3 = 2

[params.hit_min]
token = "targets.hit-min"
default = 44

[params.control]
token = "targets.control"
default = 48

[params.body_min]
token = "type.body-min"
default = 16

# ---------------------------------------------------------------------------
# Hierarchy

[[rules]]
id = "WEB-HIER-01"
category = "hierarchy"
title = "A page has no h1 or more than one"
metric = "page.h1_count"
fail_when = "ne"
threshold = 1
threshold_token = "seo.h1-count"
severity = "P1"
owner = "app"
standard = "design.web.md Search facts: exactly one h1; NNg visual hierarchy"
fix_template = "{page} has {value} h1 elements; make the page title the one h1 and demote the rest."
mockup = "none"

[[rules]]
id = "WEB-HIER-02"
category = "hierarchy"
title = "The heading outline skips a level going down"
metric = "page.heading_skip_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "WCAG 2.2 SC 1.3.1 Info and Relationships; design.web.md Accessibility floor: an ordered outline"
fix_template = "{count} headings on {page} skip a level ({sample}); step down one level at a time."
mockup = "none"

[[rules]]
id = "WEB-HIER-03"
category = "hierarchy"
title = "A section shows more than one primary button"
metric = "page.primary_buttons_per_section_max"
fail_when = "gt"
threshold = 1
severity = "P2"
owner = "app"
standard = "design.web.md Hierarchy, trust and conversion: one primary action per section; NNg visual hierarchy"
fix_template = "A section on {page} draws {value} primary buttons; keep the main action primary and make the others secondary."
mockup = "none"

[[rules]]
id = "WEB-HIER-04"
category = "hierarchy"
title = "A heading renders smaller than the body text it introduces"
metric = "text.heading_smaller_than_body_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "design.web.md Type: headings are never smaller than the body text they introduce"
fix_template = "{count} headings on {page} render smaller than the body under them ({sample})."
mockup = "none"

# ---------------------------------------------------------------------------
# Readability

[[rules]]
id = "WEB-READ-01"
category = "readability"
title = "Body, card or field text renders under the body floor"
metric = "text.body_under_floor_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "design.web.md Type: body, card text, captions and fields at least 16px; WCAG 2.2 SC 1.4.4 Resize Text; GOV.UK type scale"
fix_template = "{count} running-text runs on {page} render under 16px ({sample}); set them in the body or card role."
mockup = "none"

[[rules]]
id = "WEB-READ-02"
category = "readability"
title = "Any text run under the label floor"
metric = "text.min_px"
fail_when = "lt"
threshold = 12
threshold_token = "type.label-min"
severity = "P1"
owner = "app"
standard = "design.web.md Type: the label role is the smallest, at least 12px"
fix_template = "Text at {value}px on {page} ({sample}); the floor is 12px."
mockup = "none"

[[rules]]
id = "WEB-READ-03"
category = "readability"
title = "Running text is wider than the measure"
metric = "text.measure_over_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "design.web.md Layout: running text stops at --measure, 45 to 75 characters; Baymard line length; WCAG 2.2 SC 1.4.8 Visual Presentation"
fix_template = "{count} paragraphs on {page} run past 75 characters a line ({sample}); cap them at --measure."
mockup = "none"
devices = ["desktop"]

[[rules]]
id = "WEB-READ-04"
category = "readability"
title = "Running text has a line height under the floor"
metric = "text.leading_under_floor_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "design.web.md Type: running text at line height 1.5 or more; WCAG 2.2 SC 1.4.12 Text Spacing"
fix_template = "{count} paragraphs on {page} set their line height under 1.5 ({sample})."
mockup = "none"

[[rules]]
id = "WEB-READ-05"
category = "readability"
title = "Body or meta text under 4.5:1 against its background"
metric = "text.low_contrast_count"
fail_when = "gt"
threshold = 0
severity = "P0"
owner = "app"
standard = "WCAG 2.2 SC 1.4.3 Contrast (Minimum)"
fix_template = "{count} text runs on {page} fall under their contrast floor ({sample})."
mockup = "none"

[[rules]]
id = "WEB-READ-06"
category = "readability"
title = "Text on the footer band under its floor (7:1 body, 4.5:1 label)"
metric = "page.footer_contrast_fail_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "design.web.md Tokens: --footer-band carries white text at 7:1 and labels at 4.5:1"
fix_template = "{count} footer text runs on {page} fall under the band floor ({sample}); darken the band or lift the text."
mockup = "none"

[[rules]]
id = "WEB-READ-07"
category = "readability"
title = "A text block is centred or right-aligned"
metric = "text.not_start_aligned_count"
fail_when = "gt"
threshold = 0
severity = "P3"
owner = "app"
standard = "design.web.md Principles: one left edge; GOV.UK paragraphs"
fix_template = "{count} text blocks on {page} are centred or right-aligned ({sample}); align them to the start."
mockup = "none"

# ---------------------------------------------------------------------------
# Touch

[[rules]]
id = "WEB-TOUCH-01"
category = "touch"
title = "A link or control has an effective tap target under 44px with no 24px clearance"
metric = "targets.small_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "WCAG 2.2 SC 2.5.8 Target Size (Minimum); design.web.md targets.hit-min"
fix_template = "{count} targets on {page} are under 44px and crowd a neighbour ({sample})."
mockup = "none"
devices = ["phone", "tablet"]

[[rules]]
id = "WEB-TOUCH-02"
category = "touch"
title = "A button or field is shorter than the control height"
metric = "targets.control_under_height_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "design.web.md Tokens: --control at least 48px"
fix_template = "{count} buttons or fields on {page} are under 48px tall ({sample})."
mockup = "none"

[[rules]]
id = "WEB-TOUCH-03"
category = "touch"
title = "A phone menu link is not the element at its own centre"
metric = "page.menu_hit_miss_count"
fail_when = "gt"
threshold = 0
severity = "P0"
owner = "scaffold"
adopt = "vendor the scaffold's site header and phone menu"
standard = "design.web.md Header: no backdrop-filter, filter or transform on the header; the phone menu is tested by hit test"
fix_template = "{count} phone menu links on {page} lose the hit test at their centre; something covers them or the panel collapsed to the header."
mockup = "none"
devices = ["phone"]

