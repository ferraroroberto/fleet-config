fix_template = "{count} focusable elements on {page} draw no :focus-visible ring ({sample})."
mockup = "none"
devices = ["desktop"]

[[rules]]
id = "WEB-A11Y-02"
category = "a11y"
title = "A focused element is hidden behind the sticky header"
metric = "a11y.focus_obscured_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "scaffold"
standard = "WCAG 2.2 SC 2.4.11 Focus Not Obscured (Minimum): scroll-padding-top at least --header"
fix_template = "{count} elements on {page} sit under the sticky header when focused; set scroll-padding-top to the header height."
mockup = "none"

[[rules]]
id = "WEB-A11Y-03"
category = "a11y"
title = "A content image has no alt attribute"
metric = "page.img_missing_alt_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "WCAG 2.2 SC 1.1.1 Non-text Content; Google image SEO"
fix_template = "{count} images on {page} carry no alt attribute ({sample}); describe content images, give decorative ones alt=\"\"."
mockup = "none"

[[rules]]
id = "WEB-A11Y-04"
category = "a11y"
title = "The page has no lang, no main landmark or no skip link"
metric = "page.landmarks_missing"
fail_when = "true"
severity = "P1"
owner = "scaffold"
standard = "WCAG 2.2 SC 3.1.1 Language of Page and SC 2.4.1 Bypass Blocks; MDN lang"
fix_template = "{page} is missing {sample}; set <html lang>, wrap the content in <main> and add a skip link to it."
mockup = "none"

[[rules]]
id = "WEB-A11Y-05"
category = "a11y"
title = "Something moves without the reader asking, or ignores reduced motion"
metric = "page.motion_violation_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "WCAG 2.2 SC 2.2.2 Pause, Stop, Hide and SC 2.3.3 Animation from Interactions; NNg auto-forwarding"
fix_template = "{count} elements on {page} autoplay, animate on scroll or ignore prefers-reduced-motion ({sample})."
mockup = "none"

[[rules]]
id = "WEB-A11Y-06"
category = "a11y"
title = "A field is labelled only by its placeholder"
metric = "page.field_unlabelled_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "WCAG 2.2 SC 3.3.2 Labels or Instructions; design.web.md Fields"
fix_template = "{count} fields on {page} have no visible label ({sample})."
mockup = "none"

# ---------------------------------------------------------------------------
# Layout

[[rules]]
id = "WEB-LAYOUT-01"
category = "layout"
title = "The page scrolls sideways"
metric = "layout.overflow_x"
fail_when = "true"
severity = "P0"
owner = "app"
standard = "WCAG 2.2 SC 1.4.10 Reflow"
fix_template = "{page} is wider than the {device} viewport by {value}px ({sample})."
mockup = "none"

[[rules]]
id = "WEB-LAYOUT-02"
category = "layout"
title = "On a phone a picture is read before the text that introduces it"
metric = "page.phone_order_violation_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "design.web.md Layout: on a phone each section reads title, text, picture, then the action"
fix_template = "{count} sections on {page} show a picture before their text on a phone ({sample}); set the block order variable."
mockup = "none"
devices = ["phone"]

[[rules]]
id = "WEB-LAYOUT-03"
category = "layout"
title = "Beside a picture, a text column is squeezed under a third of the row"
metric = "page.text_column_squeezed_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "scaffold"
standard = "design.web.md Layout: image roles as min(520px, half the row), never a fixed max track"
fix_template = "{count} text columns on {page} get under a third of their row at {device} ({sample}); define the media role with min()."
mockup = "none"
devices = ["tablet"]

[[rules]]
id = "WEB-LAYOUT-04"
category = "layout"
title = "Images that share a role differ in width"
metric = "page.image_role_width_spread_px"
fail_when = "gt"
threshold = 2
severity = "P3"
owner = "app"
standard = "design.web.md Images: images of one role render at equal width (±2px)"
fix_template = "Images of the {sample} role on {page} differ by {value}px; let the role set the width."
mockup = "none"

[[rules]]
id = "WEB-LAYOUT-05"
category = "layout"
title = "A sticky picture leaves a blank stretch over 200px beside the text"
metric = "page.sticky_blank_max_px"
fail_when = "gt"
threshold = 200
severity = "P2"
owner = "scaffold"
standard = "design.web.md Product page: the sticky picture is centred under the header, never more than 160px below it"
fix_template = "Beside the description on {page}, a {value}px blank stretch opens; centre the sticky picture under the header."
mockup = "none"
devices = ["desktop"]

[[rules]]
id = "WEB-LAYOUT-06"
category = "layout"
title = "Portraits in a list differ in size or radius, or sit off their name's top"
metric = "page.portrait_misaligned_count"
fail_when = "gt"
threshold = 0
severity = "P3"
owner = "app"
standard = "design.web.md Images: portraits are square sources rounded by CSS, one size and radius in a list, top level with the name (±4px)"
fix_template = "{count} portraits on {page} break the row ({sample}); give them one size and radius and align their tops with the name."
mockup = "none"

# ---------------------------------------------------------------------------
# Components

[[rules]]
id = "WEB-COMP-01"
category = "components"
title = "A carousel shows a partial card, or not three whole cards on desktop and one plus the next card's edge on a phone"
metric = "page.carousel_partial_card_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "scaffold"
adopt = "vendor the scaffold's site carousel"
standard = "design.web.md Carousel: whole cards only, three from 1024px, on a phone one card with the next card's edge; NNg carousels"
fix_template = "{count} carousels on {page} break the whole-card rule at {device} ({sample}); size cards with grid-auto-columns, not fixed widths."
mockup = "none"
devices = ["phone", "desktop"]

[[rules]]
id = "WEB-COMP-02"
category = "components"
title = "A carousel's arrows are off centre, or one click does not move one card"
metric = "page.carousel_step_error_px"
fail_when = "gt"
threshold = 2
severity = "P3"
owner = "scaffold"
standard = "design.web.md Carousel: arrows centred under the row (±2px); one click moves one card plus the gap"
fix_template = "A carousel on {page} is off by {value}px (arrow centring or step)."
mockup = "none"
devices = ["desktop"]

[[rules]]
id = "WEB-COMP-03"
category = "components"
title = "A third-party player or iframe loads before the reader asks for it"
metric = "page.eager_embed_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "design.web.md Video: the player loads only on tap; Lighthouse third-party facades"
fix_template = "{count} embeds on {page} load on first paint ({sample}); show a thumbnail and load the player on tap."
mockup = "none"

[[rules]]
id = "WEB-COMP-04"
category = "components"
title = "The header is a containing block for fixed children"
metric = "page.header_contains_fixed"
fail_when = "true"
severity = "P1"
owner = "scaffold"
adopt = "vendor the scaffold's site header and phone menu"
standard = "design.web.md Header: never backdrop-filter, filter or transform on the header"
fix_template = "The header on {page} sets {sample}, which traps the fixed phone menu panel inside it."
mockup = "none"

# ---------------------------------------------------------------------------
# Trust and conversion

[[rules]]
id = "WEB-TRUST-01"
category = "trust"
title = "The page offers no contact route in its header or footer"
metric = "page.contact_route_missing"
fail_when = "true"
severity = "P2"
owner = "app"
standard = "WCAG 2.2 SC 3.2.6 Consistent Help; NNg trustworthy design"
fix_template = "{page} has no contact link in its header or footer; add one in the same place on every page."
mockup = "none"

[[rules]]
id = "WEB-TRUST-02"
category = "trust"
title = "A link's text does not say where it goes"
metric = "page.vague_link_text_count"
fail_when = "gt"
threshold = 0
severity = "P3"
owner = "app"
standard = "Google crawlable links: descriptive anchor text; WCAG 2.2 SC 2.4.4 Link Purpose (In Context)"
fix_template = "{count} links on {page} read as generic text ({sample}); name the destination."
mockup = "none"
params = { generic = "click here|here|read more|more|learn more|link" }

