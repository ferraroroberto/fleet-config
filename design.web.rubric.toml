title = "The page is over its page-type byte or request budget"
metric = "perf.budget_over"
fail_when = "true"
severity = "P2"
owner = "app"
standard = "web.dev performance budgets; design.web.md budgets"
fix_template = "{page} ({sample}) is over its budget; cut image weight, fonts or third parties."
mockup = "none"
devices = ["phone"]

[[rules]]
id = "WEB-PERF-06"
category = "performance"
title = "A content image ships without responsive variants or explicit dimensions"
metric = "perf.image_unoptimised_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "web.dev responsive images; web.dev optimize CLS"
fix_template = "{count} images on {page} lack srcset/sizes, a modern format or width and height ({sample})."
mockup = "none"

[[rules]]
id = "WEB-PERF-07"
category = "performance"
title = "An image below the fold loads eagerly"
metric = "perf.eager_below_fold_count"
fail_when = "gt"
threshold = 0
severity = "P3"
owner = "app"
standard = "web.dev browser-level lazy loading"
fix_template = "{count} images below the fold on {page} load eagerly ({sample}); add loading=lazy."
mockup = "none"
devices = ["phone"]

[[rules]]
id = "WEB-PERF-08"
category = "performance"
title = "A resource blocks rendering from a third-party host"
metric = "perf.render_blocking_third_party_count"
fail_when = "gt"
threshold = 0
severity = "P1"
owner = "app"
standard = "Lighthouse render-blocking resources; web.dev third-party JavaScript"
fix_template = "{count} render-blocking requests on {page} come from other hosts ({sample}); self-host or defer them."
mockup = "none"

[[rules]]
id = "WEB-PERF-09"
category = "performance"
title = "Fonts over budget, unsubset, or without font-display"
metric = "perf.font_fail"
fail_when = "true"
severity = "P3"
owner = "app"
standard = "web.dev font best practices; design.web.md performance.font-files-max / font-bytes-max"
fix_template = "{page}: {sample}. Ship at most 4 subset WOFF2 files, under 150 KB, with font-display: swap."
mockup = "none"

[[rules]]
id = "WEB-PERF-10"
category = "performance"
title = "Text is served uncompressed or hashed assets lack long-lived caching"
metric = "perf.delivery_fail_count"
fail_when = "gt"
threshold = 0
severity = "P2"
owner = "app"
standard = "Lighthouse text compression; web.dev HTTP cache; Cloudflare Pages _headers"
fix_template = "{count} responses on {page} are uncompressed or uncached ({sample}); set _headers."
mockup = "none"

# ---------------------------------------------------------------------------
# Judgment: what a fresh-context judge answers yes / no / na from the run's
# screenshots and metrics. A `no` lands on a rule in maps_to, or is raised as
# an uncatalogued finding when maps_to is empty.

[[judgment]]
id = "J-01"
question = "On the phone screenshot, does the first screen say who this is and what they offer (a title and a lead line), and show either the page's primary action or the start of its content? Answer no if the first screen is only an image, a slogan with no subject, or empty space."
maps_to = []
screens = "all"

[[judgment]]
id = "J-02"
question = "Does each page make one primary action evident (contact, book, buy, subscribe), drawn as the most prominent control in its section? Answer no if two actions compete at the same weight or the main action is a plain link. Answer na for a page with no action, such as a legal page."
maps_to = ["WEB-HIER-03"]
screens = "all"

[[judgment]]
id = "J-03"
question = "Is a contact route reachable in one tap from every page, in the same place each time? Answer no if any page lacks it or it moves between pages."
maps_to = ["WEB-TRUST-01"]
screens = "all"

[[judgment]]
id = "J-04"
question = "Where the site asks for trust (a service, a product, a booking), does it show social proof with real names (testimonials, clients, press) and clear prices where something is sold? Answer na if the page asks for nothing."
maps_to = []
screens = "all"

[[judgment]]
id = "J-05"
question = "Is the visual hierarchy clear at a glance on each viewport: the title is the largest text, section headings are next, and body text is visibly subordinate? Answer no if a decorative element, an image caption or a label competes with the title."
maps_to = ["WEB-HIER-01", "WEB-HIER-04"]
screens = "all"

[[judgment]]
id = "J-06"
question = "On the phone screenshot, does every section read title, text, picture, then action? Answer no if a picture comes before the text that introduces it, unless the desktop also shows it first."
maps_to = ["WEB-LAYOUT-02"]
screens = "all"

[[judgment]]
id = "J-07"
question = "Does every content image show whole at its own proportions, framed by the one hairline and radius, with portraits square and rounded by CSS? Answer no if a drawing is cropped, a portrait is a baked circle in a square, or two frames differ."
maps_to = ["WEB-LAYOUT-04"]
screens = "all"

[[judgment]]
id = "J-08"
question = "Do the cards of one row end level, with copy of one length and no box around the whole card? Answer na if the page has no cards."
maps_to = []
screens = "all"
