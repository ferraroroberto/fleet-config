# ---------------------------------------------------------------------------
# Performance (cold first load, throttled mobile profile)

[[rules]]
id = "WEB-PERF-01"
category = "performance"
title = "Largest Contentful Paint over 2.5 s"
metric = "perf.lcp_ms"
fail_when = "gt"
threshold = 2500
severity = "P1"
owner = "app"
