# /prompt-audit freshness-gate sources and audience vocabulary (fleet-config#831, #832).
#
# One [sources.<id>] block per vendor page. `audit.py diff-source` hashes the
# fetched `.md` twin (sha256, first 12 hex chars) and extracts the marker named by
# `marker_kind`:
#   model-list               first `marker_pattern` group in the text (default: the
#                            "including <A>, <B>, <C>." model list of a hub page)
#   llms-txt-lines           sorted unique `marker_pattern` groups (per-model guide
#                            slugs in a docs index) — a gained slug is `new-guide`
#   latest-model-frontmatter the YAML frontmatter `marker_key` value (flagship id) —
#                            a different value is `new-guide`
#   none                     sha only
#
# Baselines change only through a reviewed PR — a run that sees a moved baseline
# files the rule-set update issue instead (see SKILL.md). `baseline_final_url` is
# the URL after redirects; a moved redirect target is itself a restructuring signal.
#
# Dated changelogs (platform release notes, API changelog) are deliberately NOT
# sources: they move every week with non-prompting content, so a sha baseline would
# put every run into update mode, and "the docs site is up" is already proven by
# every other source fetching.
#
# Seeded 2026-09-13 from verbatim curl fetches; two consecutive fetches of each page
# hashed identically.

check_every_days = 7

# ---- audience vocabulary ---------------------------------------------------------
# Which vendor's rules are primary for a file is decided by the FILE's audience, not
# by the host running the audit. Everything not matched here is `neutral` (read by
# several agents). `vendor` ties an audience to a rules.md tag; `markers` are the
# scope markers that make a heading's section vendor-scoped; `terms` are the product
# words the neutrality lint looks for (case-sensitive, whole word); `path_globs`
# (fleet-root-relative, fnmatch) scope whole files; `unpointed` names files that are
# vendor-scoped only when the repo has no AGENTS.md pointing at them.

[audiences.claude]
vendor = "anthropic"
markers = ["Claude Code only"]
terms = ["Claude", "Anthropic"]
path_globs = ["*/.claude/rules/*.md"]
unpointed = ["CLAUDE.md"]

[audiences.openai]
vendor = "openai"
markers = ["Codex only"]
terms = ["Codex", "OpenAI", "GPT"]
path_globs = []
unpointed = []

