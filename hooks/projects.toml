# Sister hubs that MUST survive every port-scoped kill, fleet-wide.
# 8000  = local-llm-hub FastAPI hub
# 8090  = whisper-server (voice-transcriber)
# 8446  = app-launcher session-host (kill kills every PTY/Claude session)
[global]
never_kill_ports = [8000, 8090, 8446]
slack_notify_channel = "C0B76GBA0LS"   # fleet-wide fallback (used when a category channel below is unset)
slack_notify_user    = "U0B71PQEL6S"   # Slack user id, @mention'd only when slack_notify_mention is on
slack_notify_mention = false           # default off: the channel pushes to mobile without a tag, so the @mention was redundant noise. Flip to true to re-tag every ping.
slack_channel_attention = "C0BAGNEQ163"   # #attention — come-look pings (blocked / awaiting input / ready-to-validate / batch-ready)
slack_channel_log       = "C0BARRUBG03"   # #log — activity record (filed / shipped / merged / weekly digests / system-map image)

# Repos excluded from the architecture map (architecture/ARCHITECTURE.md + the
# generated visual). One maintainable list: vendored/external, legacy, or
# out-of-scope projects. The /system-map generator reads this and skips them.
architecture_ignore = [
  "suna",                    # vendored/external open-source AI-agent platform
  "externalrisk",           # out of scope for the personal-fleet map
  "arboldelossuenos",       # out of scope for the personal-fleet map
  "notion-automation-files", # legacy
]

# ---------------------------------------------------------------------------
# Daily fleet-private backup (fleet-config#590, hooks/backup_private.py).
#
# LAST TABLE IN THE FILE, DELIBERATELY. A TOML table header claims every bare
# key that follows it, so putting this anywhere above [global]'s keys silently
# re-parents them — inserting it before `architecture_ignore` moved that list
# into [backup] and dropped four repos off the architecture map, which is how
# this comment came to exist. New [global] keys go above this line.
#
# Its own table rather than [global] keys: both `_lib.load_registry` and
# `skills/_lib/fleet_repo_scan.fleet_repos` enumerate this file by "table
# carrying a cwd_prefix", so a [backup] table is invisible to them and cannot
# perturb the fleet-membership list.
#
# Per-repo overrides live in that repo's own table above, following the
# `capture = true` precedent:
#   backup         = false            # opt this repo out entirely
#   backup_exclude = ["_local/vm/**"] # drop a path before the bulk-dir guard sees it
#   backup_include = ["archive/"]     # keep a top-level dir the guard would drop
# ---------------------------------------------------------------------------
[backup]
source_root      = "E:/automation"
# Singular `backup` on both drives: E:/backup already existed (Rescuezilla disk
# images) and a sibling E:/backups one letter away is what gets restored from by
# mistake under pressure (fleet-config#605).
dest             = "C:/Users/rober/backup/fleet-private"
transcripts_src  = "~/.claude/projects"
transcripts_dest = "E:/backup/claude-transcripts"
# Third leg (fleet-config#724): the always-on services' SQLite databases, which
# project-scaffolding#243 moved OUT of their repo working trees to C:/sqlite/<app>/
# so seven services fsync-ing at a poll interval stop hammering the spinning E:
# drive. That root is outside every git working tree, so the git-derived selection
# above cannot see it at all — hence its own leg. Databases are snapshotted with
# SQLite's online backup API (never a byte copy of a live WAL file), and the
# max_file_mb cap below is deliberately NOT applied to this leg. Dest on E: because
# the legs cross volumes on purpose; a same-volume snapshot is refused outright.
runtime_data_src  = "C:/sqlite"
runtime_data_dest = "E:/backup/fleet-runtime-data"
keep_daily       = 14
keep_weekly      = 8
max_file_mb      = 10
# The bulk-directory guard. Measured on 2026-08-11: the deny-list and size cap
# alone still select 11.8 GB / 108k files, because gitignore is also where every
# repo parks its generated output. Any top-level directory whose surviving
# subtree crosses this is excluded whole and named in the run report. Size only
# — a file-count threshold was tried and removed, having caught nothing over
# 1.2 MB that size did not, including whatsapp-radar's 1,353 session-key files.
bulk_dir_mb      = 25
# A snapshot older than this reads `stale` from --check-freshness (daily job, so
# 48h means "a run was missed", not "a run is in flight").
freshness_max_hours = 48
