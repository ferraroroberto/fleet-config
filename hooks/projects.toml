[home-automation]
cwd_prefix          = "E:/automation/home-automation"
# _local/ mixes hand-written spike notes with a 16.7 GB Hyper-V tree and 828 MB
# of NUT captures. Dropping the two machine-generated subtrees keeps _local under
# the bulk-dir guard's threshold, so the notes are backed up instead of the whole
# directory being excluded for the VM images' sake (fleet-config#590).
backup_exclude      = ["_local/vm/**", "_local/nut/**"]
# telemetry.sqlite3 (18 MB) is alarm_scene_automation.py's/security_override_
# automation.py's event history — security-relevant, not disposable, so it's
# worth exempting from the global max_file_mb cap. webapp.log/watchdog.log
# carry the same automation activity, so they're exempted from the global
# *.log deny-glob too (fleet-config#722).
backup_always_include = ["webapp/telemetry.sqlite3"]
backup_include_globs  = ["webapp.log", "watchdog.log"]
webapp_port         = 8447
tray_cmd            = "tray.bat"
restart_cmd         = '& .\.venv\Scripts\python.exe -c "from app.webapp.manager import WebappManager; WebappManager().start(wait=True)"'
api_version_path    = "/api/version"

[local-llm-hub]
cwd_prefix          = "E:/automation/local-llm-hub"
webapp_port         = 8000
whisper_port        = 8090
gate_cmd            = "C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -File scripts/verify-before-ship.ps1"
tray_cmd            = "tray.bat"
# Legitimately owns a `claude -p` subprocess wrapper — exempts it from
# hub_bypass_warn.py's "don't re-implement the hub inline" nudge. A second
# hub-owning repo would set the same flag.
is_hub              = true

