# .fleet.toml — this repo's entry on the fleet architecture map.
# Aggregated by /system-map (.claude/skills/system-map/build_data.py); the central
# architecture/fleet.data.js is the fallback. Schema: architecture/README.md.
# Keep current: update this in the same PR as any material change (layer, port,
# role, one-line description, exposed services).
layer       = "governance"
icon        = "⚙️"
description = "Fleet-wide Claude Code hooks, skills &amp; the issue workflow."
shape       = "skills-governance"

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
static_ratchet = { src = "scripts/static_ratchet.py", sha = "2f1e2f7c81b9a91a062271881fc87830104808ae", dest = "scripts/static_ratchet.py" }
docs_ratchet   = { src = "scripts/docs_ratchet.py", sha = "fdb750461997c4a13eacea8091f115ff12bba564", dest = "scripts/docs_ratchet.py" }

# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The
# acceptance run (tests/acceptance/static_ratchet_gate.py) runs
# scripts/static_ratchet.py, which fails on a duplicate block (jscpd via npx) or an
# unused import/variable (ruff F401,F841) that is not in .static-ratchet-baseline.json.
# Needs Node and ruff (requirements.txt) in the gate's venv; a detector that cannot
# run exits 3, which fails the gate. Procedure: project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [docs_ratchet] -- the scaffold's README-size and history-marker ratchet. The
# acceptance run (tests/acceptance/docs_ratchet_gate.py) runs
# scripts/docs_ratchet.py, which fails when README.md grows past 40 KiB or past its
# baselined size, or when README.md or docs/**/*.md gains an issue reference, a
# dated heading or a changelog heading beyond .docs-ratchet-baseline.json. Docs
# state the present-tense why; history belongs to git, PRs and issues. Exit 3
# (git unusable, a file that is not UTF-8, an unclosed fence) fails the gate.
# Procedure: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"
