# .fleet.toml — this repo's entry on the fleet architecture map.
# Aggregated by /system-map (.claude/skills/system-map/build_data.py); the central
# architecture/fleet.data.js is the fallback. Schema: architecture/README.md.
# Keep current: update this in the same PR as any material change (layer, port,
# role, one-line description, exposed services).
layer       = "governance"
icon        = "⚙️"
description = "Fleet-wide Claude Code hooks, skills &amp; the issue workflow."
shape       = "skills-governance"
# One folder per surface this repo ships beyond skills/hooks (README layout tree
# describes each): per-agent config (agy, codex, pi, copilot-hooks), the shell
# profile snippet, the tray helper, the Stream Deck plugin and the slash commands.
extra_roots = ["agy", "codex", "commands", "copilot-hooks", "pi", "shell", "stream-deck", "tray"]

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
static_ratchet = { src = "scripts/static_ratchet.py", sha = "0eb0da42298e391fc614b3fe550bd6cf2d07c693", dest = "scripts/static_ratchet.py" }
docs_ratchet   = { src = "scripts/docs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/docs_ratchet.py" }
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/structure_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/comment_ratchet.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/dead_code_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/conventions_ratchet.py" }

# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The
# acceptance run (tests/acceptance/static_ratchet_gate.py) runs
# scripts/static_ratchet.py, which fails on a duplicate block (jscpd via npx) or an
# unused import/variable (ruff F401,F841), bug (B) or security (S) finding, or S113
# strict, that is not in .static-ratchet-baseline.json.
# Needs Node and ruff (requirements.txt) in the gate's venv; a detector that cannot
# run exits 3, which fails the gate. Procedure: project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [docs_ratchet] -- the scaffold's README-size and history-marker ratchet. The
# acceptance run (tests/acceptance/docs_ratchet_gate.py) runs
# scripts/docs_ratchet.py, which fails when README.md grows past 40 KiB or past its
# baselined size, or when README.md or docs/**/*.md gains an issue reference, a
# dated heading or a changelog heading beyond .docs-ratchet-baseline.json. Docs
# state the present-tense why; history belongs to git, PRs and issues. Exit 3
# (git unusable, a file that is not UTF-8, an unclosed fence) fails the gate.
# Procedure: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The
# acceptance run (tests/acceptance/structure_ratchet_gate.py) runs
# scripts/structure_ratchet.py, which fails when a new file passes 1,000 lines, a new
# function 100 lines or a flat directory 40 modules, when a baselined offender grows
# past its size in .structure-ratchet-baseline.json, and when the root folders do
# not match `shape` plus `extra_roots`. Existing offenders are baselined at today's
# size, never excluded. Exit 3 (git unusable, an unparseable file, an unknown
# shape) fails the gate. Procedure: project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet comment stage. The
# acceptance run (tests/acceptance/comment_ratchet_gate.py) runs
# scripts/comment_ratchet.py, which fails when a file's count of `#NNN` issue
# references inside comments (Python, JS, CSS, PowerShell) rises above
# .comment-ratchet-baseline.json or a new file carries any: a comment states the
# present-tense why, the history lives in the issue and git log. Vendored
# destinations are excluded automatically. Exit 3 (git unusable, a file that
# cannot be scanned) fails the gate. Procedure: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet stage for the weekly
# prompt audit's deterministic rules. The acceptance run
# (tests/acceptance/instruction_ratchet_gate.py) runs scripts/instruction_ratchet.py
# over CLAUDE.md, every SKILL.md in skill_dirs, the docs a skill links to and
# extra_files, and fails when a rule's hit count in a file rises above
# .instruction-ratchet-baseline.json or a file passes its size cap. Exit 3 (git
# unusable, a file that cannot be read, an unclosed fence, an unreadable skill
# description) fails the gate. Procedure: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled     = true
baseline    = ".instruction-ratchet-baseline.json"
skill_dirs  = ["skills", ".claude/skills"]
extra_files = ["global-CLAUDE.md"]

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet stage for stale doc
# references. The acceptance run (tests/acceptance/doc_refs_ratchet_gate.py) runs
# scripts/doc_refs_ratchet.py, which fails when README.md, CLAUDE.md or docs/**/*.md
# names a repo path, `python -m` module or relative link that does not exist and is not
# in .doc-refs-ratchet-baseline.json. Exit 3 (git unusable, a file that is not UTF-8,
# an unclosed fence) fails the gate. Procedure: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"
# Intentional pointers: files other repos or tools own (Pi's installed docs, a Codex
# method name, the hub and scaffold docs, the adopter repos' e2e and gate files) and a
# sample path quoted from a transcript.
allow_refs = [
  "docs/custom-provider.md", "docs/extensions.md", "docs/providers.md", "skills/list",
  "docs/model-comparison.md", "docs/windows-tray.md", "docs/e2e-routing.md",
  "scripts/classify_e2e.py", "scripts/verify-before-ship.ps1", "scripts/verify.js",
  "docs/screenshots/manifest.json", "tests/e2e", "tests/e2e/*",
  ".claude/skills/journal-daily/SKILL.md",
]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet stage for functions,
# classes and methods nothing refers to. The acceptance run
# (tests/acceptance/dead_code_ratchet_gate.py) runs scripts/dead_code_ratchet.py,
# which fails when a definition nothing names appears beyond
# .dead-code-ratchet-baseline.json. Exit 3 (git unusable, a tracked .py file that
# cannot be read or parsed) fails the gate. Procedure: project-scaffolding
# docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage for fleet
# conventions held as stdlib `ast` rules. The acceptance run
# (tests/acceptance/conventions_ratchet_gate.py) runs scripts/conventions_ratchet.py,
# which fails when a file's hit count for an enabled rule rises above
# .conventions-ratchet-baseline.json. Exit 3 (git unusable, a tracked .py file that
# cannot be read or parsed) fails the gate. Rules on: no-window (every spawn runs
# on Windows), logging-not-print (skills/_lib is library code; hooks print the wire
# format by design, so they sit outside print_paths), no-drive-path (nothing
# hardcodes a drive), git-wrapper (run_git exists in both tiers). secret-compare
# stays off: the repo has no constant-time compare helper. Procedure:
# project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled      = true
baseline     = ".conventions-ratchet-baseline.json"
rules        = ["no-window", "logging-not-print", "no-drive-path", "git-wrapper"]
# tests/ is exempt from the NO_WINDOW rule (CLAUDE.md) and every other rule already
# skips test modules, so nothing under it is scanned.
exclude      = ["tests/**"]
print_paths  = ["skills/_lib/"]
git_wrappers = ["hooks/_lib.py", "skills/_lib/git_run.py"]
