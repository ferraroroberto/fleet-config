# .fleet.toml — this repo's entry on the fleet architecture map.
# Aggregated by /system-map (.claude/skills/system-map/build_data.py); the central
# architecture/fleet.data.js is the fallback. Schema: architecture/README.md.
# Keep current: update this in the same PR as any material change (layer, port,
# role, one-line description, exposed services).
layer       = "governance"
icon        = "⚙️"
description = "Fleet-wide Claude Code hooks, skills &amp; the issue workflow."
shape       = "skills-governance"
# One folder per surface this repo ships beyond skills/hooks (README layout tree
# describes each): per-agent config (agy, codex, pi, copilot-hooks), the shell
# profile snippet, the tray helper, the Stream Deck plugin and the slash commands.
extra_roots = ["agy", "codex", "commands", "copilot-hooks", "pi", "shell", "stream-deck", "tray"]
# Contracts with the rest of the fleet (schema: architecture/README.md).
interfaces = [
  { name = "hooks", kind = "lib", doc = "docs/hooks.md" },
  { name = "skills", kind = "cli", doc = "docs/skills.md" },
  { name = "scheduled-runner", kind = "cli", doc = "docs/scheduled-runners.md" },
  { name = "fleet-map", kind = "file", doc = "architecture/README.md" },
]
owns       = ["user-scope agent config", "hooks", "fleet skills", "issue workflow", "fleet map"]
not_owns   = ["app code", "scaffold templates", "LLM routing", "job scheduling"]
depends_on = ["project-scaffolding", "local-llm-hub", "app-launcher"]

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
static_ratchet = { src = "scripts/static_ratchet.py", sha = "fe8cc1bdbd038ed65947186248df13072eceb25a", dest = "scripts/static_ratchet.py" }
docs_ratchet   = { src = "scripts/docs_ratchet.py", sha = "fe8cc1bdbd038ed65947186248df13072eceb25a", dest = "scripts/docs_ratchet.py" }
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "4a06ca84fc9c5005d4be7fa505c9d0e7c0472dba", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "1563f834338bcb5d6612dfbc2bdf2953b973fba2", dest = "scripts/structure_layout.py" }
structure_band = { src = "scripts/structure_band.py", sha = "3b708fd3c54ab7b93b08d489406c405762c83c41", dest = "scripts/structure_band.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "fe8cc1bdbd038ed65947186248df13072eceb25a", dest = "scripts/comment_ratchet.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "fe8cc1bdbd038ed65947186248df13072eceb25a", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "4a06ca84fc9c5005d4be7fa505c9d0e7c0472dba", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "4a06ca84fc9c5005d4be7fa505c9d0e7c0472dba", dest = "scripts/dead_code_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "ab06ad732591d4edab00774ee93a455189c14577", dest = "scripts/conventions_ratchet.py" }
conventions_readers = { src = "scripts/conventions_readers.py", sha = "ab06ad732591d4edab00774ee93a455189c14577", dest = "scripts/conventions_readers.py" }
conventions_state = { src = "scripts/conventions_state.py", sha = "fe8cc1bdbd038ed65947186248df13072eceb25a", dest = "scripts/conventions_state.py" }
runtime_write_ratchet = { src = "scripts/runtime_write_ratchet.py", sha = "4a06ca84fc9c5005d4be7fa505c9d0e7c0472dba", dest = "scripts/runtime_write_ratchet.py" }
runtime_write_resolve = { src = "scripts/runtime_write_resolve.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_resolve.py" }
instruction_frontmatter = { src = "scripts/instruction_frontmatter.py", sha = "e55de9619b9625c5499e1b9077350f9860e6037b", dest = "scripts/instruction_frontmatter.py" }
instruction_repeats = { src = "scripts/instruction_repeats.py", sha = "e55de9619b9625c5499e1b9077350f9860e6037b", dest = "scripts/instruction_repeats.py" }

# Ratchets -- the nine baseline-and-ratchet stages tests/run_acceptance.py gates on.
# What each fails on, its gate, options, baseline size and scaffold doc, and the
# conventions rules that stay off and why: docs/ratchets.md, which
# tests/acceptance/docs_index/ holds to these tables.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
# The hooks-tier copy of skills/_lib/fleet_core/runtime_files.py: hooks must import with only their own
# directory on sys.path, so the guard is repeated there, and tests/repo/test_runtime_files.py holds the
# shared functions to the same code. The skills copy is scanned.
exclude  = ["hooks/runtime_files/**"]

[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

[instruction_ratchet]
enabled     = true
baseline    = ".instruction-ratchet-baseline.json"
skill_dirs  = ["skills", ".claude/skills"]
extra_files = ["global-CLAUDE.md"]

[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"
# Intentional pointers: files other repos or tools own (Pi's installed docs, a Codex
# method name, the hub and scaffold docs, the adopter repos' e2e, gate and site preview
# files) and a sample path quoted from a transcript.
allow_refs = [
  "docs/custom-provider.md", "docs/extensions.md", "docs/providers.md", "skills/list",
  "docs/model-comparison.md", "docs/windows-tray.md", "docs/e2e-routing.md",
  "scripts/classify_e2e.py", "scripts/verify-before-ship.ps1", "scripts/verify.js",
  "scripts/site_serve.py", "scripts/serve.py",
  "docs/screenshots/manifest.json", "tests/e2e", "tests/e2e/*",
  ".claude/skills/journal-daily/SKILL.md",
]

[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

[conventions_ratchet]
enabled      = true
baseline     = ".conventions-ratchet-baseline.json"
rules        = ["no-window", "logging-not-print", "no-drive-path", "git-wrapper", "subprocess-timeout", "must-use", "state-literal", "state-set-repeat", "state-write"]
# tests/ is exempt from the NO_WINDOW rule (CLAUDE.md) and every other rule already
# skips test modules, so nothing under it is scanned.
exclude      = ["tests/**"]
# skills/_lib is library code and logs; hooks print the wire format by design.
print_paths  = ["skills/_lib/"]
git_wrappers = ["hooks/_lib.py", "skills/_lib/git_run.py"]

# One atomic-write helper per import world: hooks/_lib.py for hooks, its mirror
# skills/_lib/fleet_core/hooks_state.py for skills, config_edit.py for the root
# CLI. A raw os.replace skips the temp sweep and the cleanup on failure. No
# sqlite3.connect entry: its 4 calls take 3 shapes and share no helper.
[[conventions_ratchet.must_use]]
call   = "os.replace"
helper = ["hooks/_lib.py", "skills/_lib/fleet_core/hooks_state.py", "config_edit.py"]
why    = "atomic writes go through atomic_write_text (hooks/_lib.py, skills/_lib/fleet_core/hooks_state.py) or config_edit.atomic_write"

# The scheduled-run outcome: every fact a drained run leaves behind is ordered into
# one RunState by decide(); the exit code, verdict line, retry gate and delivery
# override read it (docs/scheduled-runners.md).
[[state_machines]]
name   = "scheduled-run-outcome"
module = "skills/_lib/scheduled/run_outcome.py"
type   = "RunState"
derive = "decide"

# The acceptance audit verdict: the findings of one `tally` ordered into a single AuditState by
# audit_state(); the `ACCEPTANCE=` line and the exit code read it.
[[state_machines]]
name   = "acceptance-audit-state"
module = "skills/_lib/acceptance_audit.py"
type   = "AuditState"
derive = "audit_state"

# The verdict of `chief_ops say --verify`: the exchange marker, the endpoint's reason and the target's
# output age ordered into one DeliveryState by finalize_delivery().
[[state_machines]]
name   = "steer-delivery"
module = "skills/_lib/chief/steer_delivery.py"
type   = "DeliveryState"
derive = "finalize_delivery"

# Where a chief proposal stands: the ledger's stored answer plus the answer window, read through
# effective_answer() only.
[[state_machines]]
name   = "proposal-answer"
module = "skills/_lib/chief/proposals.py"
type   = "ProposalAnswer"
derive = "effective_answer"

# A chief plan queue row's status; chief_plan guards each move (a question, a kind) and validate()
# refuses any value outside the set.
[[state_machines]]
name   = "chief-queue-row"
module = "skills/_lib/chief_plan.py"
type   = "QueueStatus"
derive = "validate"

# What a native-discovery probe established for one client; failed and unknown evidence never
# becomes verified (docs/cross-agent-parity.md).
[[state_machines]]
name   = "probe-status"
module = "skills/_lib/discovery_probe.py"
type   = "ProbeStatus"

# How one backup leg (and each group in it) ended; leg_status() is the only place a finished leg's
# facts become a status, and the freshness check reads the stored manifest through it.
[[state_machines]]
name   = "backup-leg-status"
module = "hooks/backup/config.py"
type   = "LegStatus"
derive = "leg_status"

[runtime_write_ratchet]
enabled      = true
baseline     = ".runtime-write-ratchet-baseline.json"
# The repo-scope skills' Python lives under .claude/skills/, beside hooks/ and skills/.
code_folders = ["hooks", "skills", "scripts", ".claude"]
# Helpers whose every definition returns a home-, state- or temp-rooted path (checked against each return
# expression), so a write through them lands outside the checkout and needs no marker.
safe_calls   = ["_dedup_file", "_marker_path", "audit_record_path", "data_dir", "inbox_dir", "log_path", "run_dir", "run_dir_for", "sources_path", "state_dir", "state_file", "state_root", "waiters_dir"]
